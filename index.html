<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" id="themeColor">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7; --card: #fff; --card2: #f2f2f7; --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.15); --fill: rgba(118,118,128,.12); --fill2: rgba(118,118,128,.2); --pressed: rgba(0,0,0,.05);
    --tint: #007aff; --tint-soft: rgba(0,122,255,.12); --red: #ff3b30; --red-soft: rgba(255,59,48,.12); --green: #34c759; --green-soft: rgba(52,199,89,.12);
    --on-tint: #fff; --fill-faint: rgba(118,118,128,.06); --seg-on: #fff; --grid: rgba(60,60,67,.12);
    --glass: rgba(255,255,255,.72); --glass-edge: rgba(255,255,255,.9);
    --glass-shadow: 0 10px 30px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
    --backdrop: rgba(0,0,0,.25);
    --r: 22px; --sheet-bg: var(--bg); --sheet-card: var(--card);
    --rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
      --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.32); --pressed: rgba(255,255,255,.06);
      --tint: #0a84ff; --tint-soft: rgba(10,132,255,.2); --red: #ff453a; --red-soft: rgba(255,69,58,.2); --green: #30d158; --green-soft: rgba(48,209,88,.16);
      --seg-on: #636366; --fill-faint: rgba(118,118,128,.12); --grid: rgba(235,235,245,.12);
      --glass: rgba(37,37,40,.68); --glass-edge: rgba(255,255,255,.12);
      --glass-shadow: 0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
      --backdrop: rgba(0,0,0,.5); --sheet-bg: #1c1c1e; --sheet-card: #2c2c2e;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="system"] {
      --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.32); --pressed: rgba(255,255,255,.06);
      --tint: #0a84ff; --tint-soft: rgba(10,132,255,.2); --red: #ff453a; --red-soft: rgba(255,69,58,.2); --green: #30d158; --green-soft: rgba(48,209,88,.16);
      --seg-on: #636366; --fill-faint: rgba(118,118,128,.12); --grid: rgba(235,235,245,.12);
      --glass: rgba(37,37,40,.68); --glass-edge: rgba(255,255,255,.12);
      --glass-shadow: 0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
      --backdrop: rgba(0,0,0,.5); --sheet-bg: #1c1c1e; --sheet-card: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--label); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 17px; letter-spacing: -.01em;
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
  }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; }
  input, textarea { font: inherit; letter-spacing: inherit; color: var(--label); }
  #app { max-width: 600px; margin: 0 auto; padding: 0 16px calc(120px + env(safe-area-inset-bottom)); }

  /* Glass controls */
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
           box-shadow: var(--glass-shadow), inset 0 0 0 .5px var(--glass-edge); }
  .circle { width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--label); flex: none; transition: transform .15s; }
  .circle.prominent { background: var(--tint); color: var(--on-tint); box-shadow: 0 6px 16px rgba(0,122,255,.3); }
  .capsule { height: 44px; padding: 0 18px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; color: var(--label); flex: none; transition: transform .15s; }
  .circle:active, .capsule:active { transform: scale(.92); }
  .pair { display: inline-flex; border-radius: 22px; height: 44px; }
  .pair button { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--label); }
  .pair button:active { opacity: .5; }

  /* Navigation bar */
  .nav { display: flex; align-items: center; gap: 8px; height: 56px; }
  .nav .title { font-weight: 600; font-size: 17px; }
  .spacer { flex: 1; }
  .large-title { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 14px; line-height: 1.12; }
  .section { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 30px 2px 12px; color: var(--label); }
  .section .opt { font-size: 15px; font-weight: 400; color: var(--label2); letter-spacing: 0; }
  .sheet .section { font-size: 15px; font-weight: 600; color: var(--label2); margin: 20px 6px 8px; letter-spacing: 0; }
  .footnote { font-size: 13px; color: var(--label2); margin: 10px 6px 0; line-height: 1.35; }

  /* Lists */
  .group { background: var(--card); border-radius: var(--r); overflow: hidden; }
  .group + .group { margin-top: 14px; }
  .cell { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 14px 18px; text-align: left; position: relative; }
  .cell:active:not(:disabled) { background: var(--pressed); }
  .cell + .cell::before, .cell-wrap + .cell-wrap::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; border-top: .5px solid var(--sep); }
  .cell-wrap { position: relative; }
  .cell .main { flex: 1; min-width: 0; font-weight: 500; }
  .cell .sub { font-size: 15px; color: var(--label2); margin-top: 2px; font-weight: 400; }
  .cell .detail { color: var(--label2); font-variant-numeric: tabular-nums; }
  .chev { color: var(--label3); flex: none; display: inline-flex; }
  .cell.action { color: var(--tint); font-weight: 500; }
  .cell.action .plus { width: 26px; height: 26px; border-radius: 50%; background: var(--tint-soft); display: inline-flex; align-items: center; justify-content: center; }
  .cell.destructive { color: var(--red); justify-content: center; font-weight: 500; }
  .cell.destructive.confirm { background: var(--red-soft); font-weight: 600; }
  .cell:disabled { color: var(--label3); }
  .empty { color: var(--label2); padding: 16px 18px; }
  .err { color: var(--red); font-size: 14px; margin: 10px 6px 0; }
  .err:empty { display: none; }

  /* Big tinted buttons */
  .btn-tinted { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: 26px; background: var(--tint-soft); color: var(--tint); font-weight: 600; margin-top: 14px; transition: transform .15s; }
  .btn-tinted:active, .primary:active { transform: scale(.97); }
  .primary { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; background: var(--tint); color: var(--on-tint); border-radius: 26px; font-weight: 600; margin-top: 16px; transition: transform .15s; }

  /* Search field */
  .search { display: flex; align-items: center; gap: 8px; background: var(--fill); border-radius: 22px; padding: 0 14px; height: 44px; margin-bottom: 14px; color: var(--label2); }
  .search input { flex: 1; border: 0; background: none; outline: none; font-size: 17px; height: 100%; padding: 0; -webkit-appearance: none; }
  .search input::placeholder { color: var(--label2); }
  .search input::-webkit-search-cancel-button { display: none; }

  /* Week strip */
  .weekhead { display: flex; align-items: center; gap: 8px; height: 56px; }
  .weekhead .title { font-size: 26px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .weekhead .title .yr { color: var(--label2); font-weight: 600; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 6px 0 22px; touch-action: pan-y; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 8px; border-radius: 22px; transition: background .2s; }
  .day:active { background: var(--fill); }
  .day .wd { font-size: 12px; color: var(--label2); font-weight: 600; }
  .day .num { font-family: var(--rounded); font-size: 20px; font-weight: 600; line-height: 24px; }
  .day.today .num, .day.today .wd { color: var(--red); }
  .day.sel { background: var(--label); }
  .day.sel .wd, .day.sel .num { color: var(--bg); }
  .day.sel.today { background: var(--red); }
  .day.sel.today .wd, .day.sel.today .num { color: #fff; }
  .dot { width: 5px; height: 5px; border-radius: 50%; }
  .dot.on { background: var(--label3); }
  .day.sel .dot.on { background: var(--bg); opacity: .7; }
  .day.sel.today .dot.on { background: #fff; }
  .day-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 0 2px 2px; }
  .day-sub { color: var(--label2); font-size: 15px; margin: 0 2px 14px; }

  /* Last-time card */
  .lastbar { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border-radius: var(--r); padding: 14px 16px 14px 18px; margin-bottom: 14px; }
  .lastbar:active { background: var(--card2); }
  .lastbar .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .lb-label { font-size: 13px; color: var(--label2); font-weight: 500; }
  .lb-sets { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .lb-more { font-size: 15px; color: var(--tint); font-weight: 500; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
  .lb-more .chev { color: var(--tint); }

  details.instr { background: var(--card); border-radius: var(--r); margin-bottom: 14px; padding: 0 18px; }
  details.instr summary { padding: 15px 0; color: var(--tint); font-weight: 500; cursor: pointer; list-style: none; }
  details.instr summary::-webkit-details-marker { display: none; }
  details.instr[open] summary { border-bottom: .5px solid var(--sep); }
  .instr-text { white-space: pre-wrap; padding: 14px 0; line-height: 1.45; }
  details.instr a { display: inline-block; padding: 0 0 14px; font-weight: 500; }

  /* Set rows */
  .sets-head, .setrow { display: grid; grid-template-columns: 30px 1fr 1fr 48px; gap: 10px; align-items: center; padding: 0 10px 0 18px; }
  .sets-head { font-size: 13px; color: var(--label2); font-weight: 600; height: 40px; padding-top: 6px; }
  .sets-head span:nth-child(2), .sets-head span:nth-child(3) { text-align: center; }
  .setrow { min-height: 60px; position: relative; transition: background .2s; }
  .setrow + .setrow::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; border-top: .5px solid var(--sep); }
  .setrow .sn { font-family: var(--rounded); font-weight: 700; color: var(--label3); font-size: 17px; }
  .setrow input { font-family: var(--rounded); width: 100%; height: 42px; border: 0; border-radius: 14px; background: var(--fill-faint); text-align: center; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--label3); outline: none; padding: 0 4px; transition: background .2s, color .2s; }
  .setrow input:focus { box-shadow: 0 0 0 2px var(--tint) inset; color: var(--label); }
  .setrow input.bad { box-shadow: 0 0 0 2px var(--red) inset; }
  .setrow.done .sn { color: var(--label); }
  .setrow.done input { color: var(--label); background: var(--fill); }
  .check { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
  .check .ring { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--label3); display: flex; align-items: center; justify-content: center; transition: all .2s cubic-bezier(.3,1.5,.6,1); }
  .setrow.done .check .ring { background: var(--green); border-color: var(--green); color: #fff; transform: scale(1.05); }
  .check:active .ring { transform: scale(.85); }

  .stepper { display: flex; align-items: center; margin: 16px auto 0; border-radius: 22px; width: max-content; height: 44px; }
  .stepper button { width: 52px; height: 44px; font-size: 22px; color: var(--label); display: flex; align-items: center; justify-content: center; }
  .stepper button:active:not(:disabled) { opacity: .5; }
  .stepper button:disabled { color: var(--label3); }
  .stepper span { min-width: 70px; text-align: center; font-size: 15px; font-weight: 500; color: var(--label2); }

  /* Segmented control */
  .seg { display: flex; background: var(--fill); border-radius: 22px; padding: 3px; margin-bottom: 14px; }
  .seg button { flex: 1; height: 36px; border-radius: 18px; font-size: 14px; font-weight: 500; color: var(--label); transition: background .2s; }
  .seg button.on { background: var(--seg-on); font-weight: 600; box-shadow: 0 3px 10px rgba(0,0,0,.12); }

  /* Calendar */
  .cal-card { background: var(--card); border-radius: var(--r); padding: 10px 8px 12px; }
  .cal-head, .cal { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .cal-head div { font-size: 12px; color: var(--label2); padding: 8px 0; font-weight: 600; }
  .cal button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px 0 5px; }
  .cal .num { font-family: var(--rounded); width: 40px; height: 40px; line-height: 40px; border-radius: 50%; font-size: 19px; font-weight: 500; }
  .cal .out .num { color: var(--label3); }
  .cal .today .num { color: var(--red); font-weight: 700; }
  .cal .sel .num { background: var(--label); color: var(--bg); font-weight: 700; }
  .cal .sel.today .num { background: var(--red); color: #fff; }

  /* Progress card */
  .card { background: var(--card); border-radius: var(--r); padding: 18px 18px 14px; }
  .headline { font-family: var(--rounded); font-size: 40px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 2px 0; }
  .headline small { font-size: 20px; font-weight: 600; color: var(--label2); margin-left: 3px; }
  .hsub { font-size: 15px; color: var(--label2); }
  .hsub.up { color: var(--green); font-weight: 500; }
  .chart { position: relative; height: 210px; margin: 12px 0 0; }
  .chart svg { display: block; touch-action: pan-y; }
  .tip { position: absolute; top: 0; transform: translateX(-50%); color: var(--label); font-size: 13px; padding: 6px 12px; border-radius: 14px; white-space: nowrap; pointer-events: none; }
  .tip b { font-weight: 700; }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  a { color: var(--tint); text-decoration: none; }
  a.cell:not(.action) { color: var(--label); }

  /* History day cards */
  .hcard { background: var(--card); border-radius: var(--r); overflow: hidden; margin-bottom: 14px; padding-bottom: 6px; }
  .hcard-head { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 18px 8px; }
  .hcard-head b { font-size: 17px; font-weight: 700; }
  .hcard-head span { font-size: 14px; color: var(--label2); font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: 12px; font-weight: 500; }
  .hset { display: flex; align-items: center; padding: 8px 18px; font-variant-numeric: tabular-nums; }
  .hset .n { font-family: var(--rounded); width: 30px; height: 26px; border-radius: 13px; background: var(--fill); color: var(--label2); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-right: 14px; }
  .hset .v { font-weight: 500; }

  #status { color: var(--red); font-size: 15px; padding-top: 6px; }

  /* Sheets (floating) */
  #sheet[hidden] { display: none; }
  .backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 20; animation: fade .25s; }
  .sheet {
    position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 21; max-width: 584px; margin: 0 auto;
    max-height: calc(100% - 56px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch;
    border-radius: 34px; padding: 0 14px 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    animation: up .38s cubic-bezier(.2,.9,.25,1);
  }
  .sheet { background: var(--sheet-bg); } .sheet .group { background: var(--sheet-card); }
  @keyframes up { from { transform: translateY(110%); } }
  @keyframes fade { from { opacity: 0; } }
  .sheet-head { position: sticky; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 68px; z-index: 1; background: inherit; }
  .sheet-head > :first-child { justify-self: start; }
  .sheet-head > :last-child { justify-self: end; }
  .sheet-head b { font-size: 17px; font-weight: 600; }
  .field-input { width: 100%; border: 0; outline: none; background: none; font-size: 17px; padding: 15px 18px; display: block; }
  textarea.field-input { resize: vertical; min-height: 104px; line-height: 1.4; }
  .field-input::placeholder { color: var(--label3); }

  /* Scroll wheels */
  .wheels { display: flex; align-items: center; gap: 6px; padding: 8px 12px; }
  .wheels .x { color: var(--label2); font-size: 17px; }
  .wheel { position: relative; height: 180px; flex: 1; }
  .wheel-scroll {
    height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
            mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
  }
  .wheel-scroll::-webkit-scrollbar { display: none; }
  .wheel.single { height: 48px; }
  .wheel.single .wheel-scroll { -webkit-mask-image: none; mask-image: none; }
  .wheel.single .wheel-pad { height: 4px; }
  .wheel.single .wheel-band { top: 4px; }
  .wheel-pad { height: 70px; }
  .wheel-opt { height: 40px; line-height: 40px; text-align: center; scroll-snap-align: center; font-size: 21px; color: var(--label2); }
  .wheel-opt.on { color: var(--label); font-weight: 500; }
  .wheel-band { position: absolute; left: 0; right: 0; top: 70px; height: 40px; background: var(--fill); border-radius: 12px; pointer-events: none; }

  /* Reorder + trash */
  .drag-row { display: flex; align-items: center; background: var(--card); transition: transform .2s cubic-bezier(.2,.8,.3,1); }
  .drag-row .cell { flex: 1; min-width: 0; }
  .drag-row.dragging { transition: none; z-index: 2; box-shadow: 0 10px 30px rgba(0,0,0,.18); border-radius: 14px; }
  .sorting { user-select: none; -webkit-user-select: none; }
  .grip { width: 44px; height: 52px; display: flex; align-items: center; justify-content: center; color: var(--label3); touch-action: none; flex: none; cursor: grab; }
  .trash { min-width: 44px; height: 36px; margin-right: 10px; padding: 0 8px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: var(--red); flex: none; font-size: 15px; font-weight: 600; transition: all .2s; }
  .trash:active { background: var(--red-soft); }
  .trash.confirm { background: var(--red); color: #fff; padding: 0 14px; }

  /* Exercise pager */
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--label2); margin: 2px 2px 2px; }
  .eyebrow + .large-title { margin-top: 0; }
  .slide-wrap.from-right { animation: fromRight .28s cubic-bezier(.2,.9,.3,1); }
  .slide-wrap.from-left { animation: fromLeft .28s cubic-bezier(.2,.9,.3,1); }
  @keyframes fromRight { from { transform: translateX(40px); opacity: 0; } }
  @keyframes fromLeft { from { transform: translateX(-40px); opacity: 0; } }

  /* Screen transitions: deeper screens slide up from the bottom, going back slides them down */
  #app { position: relative; z-index: 2; background: var(--bg); min-height: 100vh; }
  .ghost { position: fixed; left: 0; right: 0; margin: 0 auto; max-width: 600px; padding: 0 16px; z-index: 1; pointer-events: none; background: var(--bg); }
  .ghost.top { z-index: 3; box-shadow: 0 -10px 40px rgba(0,0,0,.15); border-radius: 28px 28px 0 0; }
  .enter-up { animation: enterUp .42s cubic-bezier(.2,.9,.25,1); box-shadow: 0 -10px 40px rgba(0,0,0,.15); border-radius: 28px 28px 0 0; }
  .recede { animation: recede .42s cubic-bezier(.2,.9,.25,1) forwards; }
  .leave-down { animation: leaveDown .36s cubic-bezier(.4,0,.8,.6) forwards; }
  .under { animation: under .36s cubic-bezier(.2,.9,.25,1); }
  @keyframes enterUp { from { transform: translateY(100vh); } }
  @keyframes recede { to { transform: scale(.94); opacity: .5; } }
  @keyframes leaveDown { to { transform: translateY(100vh); } }
  @keyframes under { from { transform: scale(.94); opacity: .5; } }

  /* Swiping */
  #app { overflow-x: clip; }
  .swipe-area { min-height: calc(100vh - 56px - env(safe-area-inset-top)); }
  .pager, .week-track { position: relative; will-change: transform; }
  .peek { position: absolute; width: 100%; pointer-events: none; }
  .slide-wrap, .peek { display: flow-root; }

<body>
<div id="app"></div>

<script>
/* ================= Storage ================= */
const KEY = 'tt.v1';
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!d || !d.exercises) d = { exercises: [], days: {}, sets: [] };
  return migrate(d);
}
function migrate(d) {
  d.workouts = d.workouts || [];
  d.exercises.forEach(e => {
    e.track = e.track || ['weight', 'reps'];
    e.instructions = e.instructions || '';
    e.video = e.video || '';
  });
  for (const k in d.days) {
    const day = d.days[k];
    if (day.exercises && !day.items) { day.items = day.exercises.map(exId => ({ exId, sets: null })); delete day.exercises; }
    day.items = day.items || [];
    day.workouts = day.workouts || [];
  }
  // v3: every set gets a slot (its row number within that day)
  const groups = {};
  d.sets.forEach(s => { if (s.slot === undefined) (groups[s.exId + '|' + s.date] = groups[s.exId + '|' + s.date] || []).push(s); });
  Object.values(groups).forEach(g => {
    const taken = new Set(d.sets.filter(s => s.slot !== undefined && s.exId === g[0].exId && s.date === g[0].date).map(s => s.slot));
    let i = 0;
    g.sort((a, b) => a.ts - b.ts).forEach(s => { while (taken.has(i)) i++; s.slot = i++; });
  });
  d.plans = d.plans || [];
  if (d.activePlan === undefined) d.activePlan = null;
  d.settings = Object.assign({ units: 'metric', theme: 'system', weekStart: 1, defaultSets: 3, name: '' }, d.settings || {});
  d.version = 3;
  return d;
}
let data = load();
let saveError = '';
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); saveError = ''; }
  catch (e) { saveError = "Couldn't save on this device."; }
}
function save() { saveLocal(); if (typeof scheduleSync === 'function') scheduleSync(); }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ================= Dates ================= */
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const startOfWeek = d => addDays(d, -((d.getDay() - data.settings.weekStart + 7) % 7)); // Monday or Sunday, per Settings
const todayKey = () => dk(new Date());
const wd = () => data.settings.weekStart === 0 ? ['S', 'M', 'T', 'W', 'T', 'F', 'S'] : ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
const fmtLong = k => parse(k).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = k => parse(k).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTiny = k => parse(k).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmtDayYear = k => parse(k).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).replace(',', '');
const monthName = d => d.toLocaleDateString('en-GB', { month: 'long' });

/* ================= Helpers ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtW = w => String(Math.round(w * 100) / 100);
const exById = id => data.exercises.find(e => e.id === id);
const woById = id => data.workouts.find(w => w.id === id);
const dayOf = k => data.days[k] || virtualDay(k) || { items: [], workouts: [] };
const setsFor = (exId, k) => data.sets.filter(s => s.exId === exId && s.date === k).sort((a, b) => a.slot - b.slot || a.ts - b.ts);
const loggedDays = () => new Set(data.sets.map(s => s.date));
// Filled dot = trained that day; ring = a planned workout day still to come
const dotCls = (k, logged) => logged.has(k) ? 'on' : (k >= todayKey() && dayOf(k).items.length) ? 'plan' : '';
const byName = (a, b) => a.name.localeCompare(b.name);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function ytId(url) {
  const m = String(url).match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}
/* Units: weights are always stored in kg; shown and typed in the unit chosen in Settings */
const LB = 2.20462262;
const isImp = () => data.settings.units === 'imperial';
const U = () => isImp() ? 'lb' : 'kg';

const parseW = v => { const n = parseFloat(String(v).replace(',', '.')); return n >= 0 ? n : NaN; };
const parseR = v => { const n = parseInt(v, 10); return n > 0 ? n : NaN; };

   roughly 10 reps or fewer (LeSuer et al. 1997 recommended it for squat and bench). */
const e1rm = s => s.reps <= 1 ? s.weight : (100 * s.weight) / (48.8 + 53.8 * Math.exp(-0.075 * s.reps));

const TRACK_A = [{ v: 'weight', label: 'Weight' }];
const TRACK_B = [{ v: 'reps', label: 'Reps' }];

/* ================= Icons (SF Symbols-style) ================= */
const svg = (p, s = 22, sw = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

const ICON_SETTINGS = svg('<circle cx="12" cy="12" r="3"/><path d="M12 2.8l1.6 2.3 2.8-.4.9 2.7 2.5 1.3-.6 2.7 1.6 2.3-2.1 1.9.1 2.8-2.7.6-1.2 2.5-2.6-1-2.6 1-1.2-2.5-2.7-.6.1-2.8-2.1-1.9 1.6-2.3-.6-2.7 2.5-1.3.9-2.7 2.8.4z"/>', 26, 1.6);
const ICON_EXERCISES = svg('<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>', 26, 1.9);
const ICON_X = svg('<path d="M6 6l12 12M18 6L6 18"/>', 18, 2.4);
const ICON_OK = svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 20, 2.6);

const ICON_NEXT = svg('<path d="M9 5l7 7-7 7"/>', 18, 2.4);
const ICON_DOWN = svg('<path d="M5 9l7 7 7-7"/>', 22, 2.4);
// Every screen that has a back button slides down when you go back, so the button points down
const backBtn = label => `<button class="circle glass" id="back" aria-label="Back to ${esc(label)}">${ICON_DOWN}</button>`;
const closeBtn = (id, label = 'Cancel') => `<button class="circle glass" id="${id}" aria-label="${label}">${ICON_X}</button>`;

const ICON_GRIP = svg('<path d="M5 9h14M5 15h14"/>', 20, 2.2);
const ICON_TIMER = svg('<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5"/>', 18, 2);

/* ================= State & routing ================= */
const state = {
  tab: 'today',
  views: { today: 'day', workouts: 'wList', exercises: 'eList', friends: 'friends', settings: 'settings' },
  selected: todayKey(),
  weekStart: startOfWeek(new Date()),
  logExId: null,
  calMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  pending: null,
  pickerMode: null,
  pickerQuery: '',
  exQuery: '',
  detailExId: null,
  stat: 'e1rm',
  draft: null,        // workout being edited
  sheet: null,        // open bottom sheet
  drafts: {},         // unsaved values typed into set rows: { 'exId|date': { slot: {w, r} } }
};
const app = $('app');
const TAB_ROOT = { today: 'day', workouts: 'wList', exercises: 'eList', friends: 'friends', settings: 'settings' };

function render() {
  const VIEWS = { day: renderDay, log: renderLog, finish: renderFinish, history: renderHistory, picker: renderPicker, calendar: renderCalendar,
                  wList: renderWorkoutList, wEdit: renderWorkoutEdit, pView: renderPlanView, pEdit: renderPlanEdit, eList: renderExerciseList, eDetail: renderExerciseDetail,
                  friends: renderFriends, friend: renderFriend, fEx: renderFriendExercise, settings: renderSettings };
  clearInterval(timerTick);
  app.ontouchstart = app.ontouchend = null;

  renderDock();
  renderSheet();
}
const DEPTH = { day: 0, wList: 0, eList: 0, friends: 0, settings: 0, log: 1, finish: 1, picker: 1, calendar: 1, eDetail: 1, wEdit: 1, pView: 1, pEdit: 2, history: 2, friend: 1, fEx: 2 };

// Snapshot of the current screen, used as the layer the new screen slides over (or that slides away)
function ghost(onTop) {
  const g = app.cloneNode(true);
  g.removeAttribute('id');
  g.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  g.className = 'ghost' + (onTop ? ' top' : '');

}

  delete extra.anim;
  const g = dir && !reduceMotion() ? ghost(dir === 'down') : null;
  Object.assign(state, extra);
  state.views[state.tab] = view;
  state.pending = null;
  render();
  window.scrollTo(0, 0);
  if (!g) return;
  document.querySelectorAll('.ghost').forEach(x => { if (x !== g) x.remove(); });

  void app.offsetWidth;
  app.classList.add(dir === 'up' ? 'enter-up' : 'under');
  g.classList.add(dir === 'up' ? 'recede' : 'leave-down');
  setTimeout(() => { g.remove(); app.classList.remove('enter-up', 'under'); }, 420);
}

/* ================= Tab bar ================= */
function renderDock() {
  // Today stays in the middle
  const tabs = [['friends', 'Friends', ICON_FRIENDS], ['workouts', 'Workouts', ICON_WORKOUTS], ['today', 'Today', ICON_TODAY], ['exercises', 'Exercises', ICON_EXERCISES], ['settings', 'Settings', ICON_SETTINGS]];
  const dock = $('dock');
  const reqs = (typeof friends !== 'undefined' && cloud.user) ? friends.links.filter(l => l.status === 'pending' && l.from !== cloud.user.uid).length : 0;
  dock.innerHTML = tabs.map(([t, label, icon]) => `<button data-tab="${t}" class="${state.tab === t ? 'on' : ''}" aria-label="${label}${t === 'friends' && reqs ? `, ${reqs} new` : ''}">${icon}${t === 'friends' && reqs ? `<span class="tab-badge">${reqs}</span>` : ''}<span>${label}</span></button>`).join('');

const ITEM = 40;
function wheelHTML(id, options) {
  return `<div class="wheel${options.length === 1 ? ' single' : ''}" id="${id}"><div class="wheel-band"></div><div class="wheel-scroll"><div class="wheel-pad"></div>${options.map((o, i) =>
    `<div class="wheel-opt" data-i="${i}">${esc(o.label)}</div>`).join('')}<div class="wheel-pad"></div></div></div>`;
}
function initWheel(id, index) {
  const sc = $(id).querySelector('.wheel-scroll');
  const opts = [...sc.querySelectorAll('.wheel-opt')];
  const mark = () => { const i = wheelIndex(id); opts.forEach((o, j) => o.classList.toggle('on', i === j)); };
  sc.scrollTop = index * ITEM;
  mark();
  sc.addEventListener('scroll', mark, { passive: true });
  opts.forEach(o => o.onclick = () => sc.scrollTo({ top: Number(o.dataset.i) * ITEM, behavior: 'smooth' }));
}
function wheelIndex(id) {
  const sc = $(id).querySelector('.wheel-scroll');
  const n = sc.querySelectorAll('.wheel-opt').length;
  return Math.max(0, Math.min(n - 1, Math.round(sc.scrollTop / ITEM)));
}

/* ================= Drag to reorder ================= */
// Press and drag a row's grip handle; the other rows slide out of the way.
function makeSortable(list, onMove) {
  list.querySelectorAll('.drag-row .grip').forEach(grip => {
    grip.addEventListener('pointerdown', e => {
      e.preventDefault();
      const rows = [...list.querySelectorAll(':scope > .drag-row')];
      const row = grip.closest('.drag-row');
      const from = rows.indexOf(row);
      const rects = rows.map(r => r.getBoundingClientRect());
      const h = rects[from].height;
      const y0 = e.clientY;
      let to = from;
      grip.setPointerCapture(e.pointerId);
      list.classList.add('sorting');
      row.classList.add('dragging');
      const move = ev => {
        const dy = Math.max(rects[0].top - rects[from].top - h * .6, Math.min(rects[rows.length - 1].top - rects[from].top + h * .6, ev.clientY - y0));
        row.style.transform = `translateY(${dy}px)`;
        const center = rects[from].top + h / 2 + dy;
        to = from;
        rows.forEach((r, j) => {
          const mid = rects[j].top + rects[j].height / 2;
          if (j > from && center > mid) to = j;
          if (j < from && center < mid && to === from) to = j;
        });
        rows.forEach((r, j) => {
          if (j === from) return;
          const shift = (from < to && j > from && j <= to) ? -h : (to < from && j >= to && j < from) ? h : 0;
          r.style.transform = shift ? `translateY(${shift}px)` : '';
        });
      };
      const up = () => {
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', up);
        grip.removeEventListener('pointercancel', up);
        list.classList.remove('sorting');
        if (to !== from) onMove(from, to);
        else { row.classList.remove('dragging'); rows.forEach(r => { r.style.transform = ''; }); }
      };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', up);
      grip.addEventListener('pointercancel', up);
    });
  });
}

/* ================= TODAY: day view ================= */
function weekLabel(ws) {
  const we = addDays(ws, 6);
  const thisYear = new Date().getFullYear();
  const yr = y => y === thisYear ? '' : ` <span class="yr">${y}</span>`;
  if (ws.getMonth() === we.getMonth()) return `${monthName(ws)}${yr(ws.getFullYear())}`;
  return `${monthName(ws).slice(0, 3)} – ${monthName(we).slice(0, 3)}${yr(we.getFullYear())}`;
}

function renderDay() {
  const logged = loggedDays();
  const tk = todayKey();
  const showToday = dk(state.weekStart) !== dk(startOfWeek(new Date())) || state.selected !== tk;
  const weekHTML = ws => `<div class="week">${Array.from({ length: 7 }, (_, i) => {
    const k = dk(addDays(ws, i));
    const cls = ['day', k === tk && 'today', k === state.selected && 'sel'].filter(Boolean).join(' ');
    return `<button class="${cls}" data-k="${k}"><span class="wd">${wd()[i]}</span><span class="num">${parse(k).getDate()}</span><span class="dot ${dotCls(k, logged)}"></span></button>`;
  }).join('')}</div>`;

  const day = dayOf(state.selected);
  const pd = planDayFor(state.selected);
  const canMove = pd && pd.workout && state.selected >= tk && !logged.has(state.selected) && !(day.session && day.session.start);
  const rows = day.items.map(it => {
    const ex = exById(it.exId); if (!ex) return '';
    const s = setsFor(it.exId, state.selected);
    const total = Math.max(it.sets || 0, s.length);
    const sub = s.length ? s.map(x => `${W(x.weight)}×${x.reps}`).join(', ') : `${plural(total, 'set')} planned`;
    const confirm = state.pending === 'trash:' + it.exId;
    return `<div class="cell-wrap drag-row" data-row="${it.exId}">
      <button class="grip" aria-label="Drag to reorder ${esc(ex.name)}">${ICON_GRIP}</button>
      <button class="cell" data-ex="${it.exId}" style="padding-left:4px"><span class="main"><div>${esc(ex.name)}</div><div class="sub">${s.length ? `${s.length}/${total} · ` : ''}${sub}</div></span></button>
      <button class="trash ${confirm ? 'confirm' : ''}" data-trash="${it.exId}" aria-label="Remove ${esc(ex.name)}">${confirm ? 'Delete' : ICON_TRASH}</button>
    </div>`;
  }).join('');

  app.innerHTML = `
    <header class="weekhead">
      <span class="title">${weekLabel(state.weekStart)}</span>
      <span class="spacer"></span>
      ${showToday ? '<button class="capsule glass" id="today">Today</button>' : ''}
      <span class="pair glass"><button id="prevW" aria-label="Previous week">${ICON_PREV}</button><button id="nextW" aria-label="Next week">${ICON_NEXT}</button></span>
      <button class="circle glass" id="calBtn" aria-label="Calendar">${ICON_CAL}</button>
    </header>
    <div class="week-wrap" id="weekWrap"><div class="week-track" id="weekTrack">${weekHTML(state.weekStart)}</div></div>
    <div class="day-title">${fmtLong(state.selected)}</div>
    <div class="day-sub">${day.workouts.length ? day.workouts.map(w => esc(w.name)).join(' + ') : (day.items.length ? 'Custom workout' : 'Rest day')}${pd ? ` · ${esc(pd.plan.name)}${pd.index >= 0 ? `, day ${pd.index + 1} of ${pd.plan.days.length}` : ' (moved)'}` : ''}${day.session ? ` · ${day.session.end ? 'Finished in ' + fmtMins(day.session.end - day.session.start) : 'In progress'}` : ''}</div>
    ${canMove ? `<button class="capsule glass move-btn" id="moveDay">${svg('<path d="M4 12h13M13 7l5 5-5 5"/>', 16, 2.2)} Move to tomorrow</button>` : ''}
    ${day.items.length ? `<div class="group" id="dayList">${rows}</div>` : ''}
    ${day.items.length && !isFinished(state.selected) && (logged.has(state.selected) || (day.session && day.session.start)) ? `<button class="primary" id="finishDay">${svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 18, 2.6)}&nbsp;Finish workout</button>` : ''}
    <button class="btn-tinted" id="addEx">${ICON_PLUS} Add exercise / workout</button>`;

  const shift = n => { state.weekStart = addDays(state.weekStart, 7 * n); render(); };
  $('prevW').onclick = () => shift(-1);
  $('nextW').onclick = () => shift(1);
  if ($('today')) $('today').onclick = () => { state.selected = tk; state.weekStart = startOfWeek(new Date()); render(); };
  $('calBtn').onclick = () => { const d = parse(state.selected); go('calendar', { calMonth: new Date(d.getFullYear(), d.getMonth(), 1) }); };
  $('addEx').onclick = () => go('picker', { pickerQuery: '', pickerMode: data.workouts.length ? 'workouts' : 'exercises' });
  app.querySelectorAll('.day').forEach(b => b.onclick = () => { state.selected = b.dataset.k; render(); });
  app.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => go('log', { logExId: b.dataset.ex }));
  if ($('finishDay')) $('finishDay').onclick = () => openFinish(state.selected);
  if ($('moveDay')) $('moveDay').onclick = () => { shiftPlan(state.selected, 1); save(); render(); };
  app.querySelectorAll('[data-trash]').forEach(b => b.onclick = () => {
    const exId = b.dataset.trash, k = state.selected;
    const hasSets = setsFor(exId, k).length > 0;
    if (hasSets && state.pending !== 'trash:' + exId) { state.pending = 'trash:' + exId; return render(); }
    const d = ensureDay(k);
    d.items = d.items.filter(i => i.exId !== exId);
    data.sets = data.sets.filter(x => !(x.exId === exId && x.date === k));
    delete state.drafts[exId + '|' + k];
    if (!d.items.length && !d.plan) delete data.days[k];   // an emptied planned day stays (as empty) so the plan doesn't refill it
    save(); state.pending = null; render();
  });

    const items = ensureDay(state.selected).items;
    items.splice(to, 0, items.splice(from, 1)[0]);
    save(); render();
  });

  swipePager($('weekWrap'), $('weekTrack'), {
    peek: dir => weekHTML(addDays(state.weekStart, 7 * dir)),
    commit: dir => shift(dir),
  });
}

/* ================= TODAY: log sets ================= */
function logModel(k, idx) {
  const day = dayOf(k);
  const item = day.items[idx];
  const ex = item && exById(item.exId);
  if (!ex) return null;
  const today = setsFor(ex.id, k);
  const bySlot = {};
  today.forEach(s => { bySlot[s.slot] = s; });
  const maxSlot = today.reduce((m, s) => Math.max(m, s.slot), -1);
  const n = Math.max(item.sets || 0, maxSlot + 1);
  const dkey = ex.id + '|' + k;
  const drafts = (state.drafts[dkey] = state.drafts[dkey] || {});
  const prevDates = [...new Set(data.sets.filter(s => s.exId === ex.id && s.date < k).map(s => s.date))].sort();
  const prevK = prevDates[prevDates.length - 1];
  const prevSets = prevK ? setsFor(ex.id, prevK) : [];
  return { day, item, ex, today, bySlot, n, dkey, drafts, prevK, prevSets, idx, total: day.items.length };
}

// Suggested values for a row that isn't done yet:
// what you typed → the closest finished set above it today → same set last time → last set last time
function suggest(m, i) {
  if (m.drafts[i]) return m.drafts[i];
  for (let j = i - 1; j >= 0; j--) if (m.bySlot[j]) return { w: W(m.bySlot[j].weight), r: String(m.bySlot[j].reps) };
  const p = m.prevSets[i] || m.prevSets[m.prevSets.length - 1];
  return p ? { w: W(p.weight), r: String(p.reps) } : { w: '', r: '' };
}

function logBodyHTML(m) {
  const { ex, bySlot, n, prevK, prevSets } = m;
  let rows = '';
  for (let i = 0; i < n; i++) {
    const s = bySlot[i];
    const v = s ? { w: W(s.weight), r: String(s.reps) } : suggest(m, i);
    rows += `<div class="setrow ${s ? 'done' : ''}" data-i="${i}">
      <span class="sn">${i + 1}</span>
      <input class="w" inputmode="decimal" autocomplete="off" aria-label="Set ${i + 1} weight in ${U()}" value="${esc(v.w)}" placeholder="${U()}">
      <input class="r" inputmode="numeric" autocomplete="off" aria-label="Set ${i + 1} reps" value="${esc(v.r)}" placeholder="reps">
      <button class="check" aria-label="${s ? 'Undo' : 'Complete'} set ${i + 1}"><span class="ring">${s ? ICON_CHECK : ''}</span></button>
    </div>`;
  }
  const canMinus = n > 0 && !bySlot[n - 1];
  const vid = ytId(ex.video);
  return `
    <div class="eyebrow">Exercise ${m.idx + 1} of ${m.total}</div>
    <div class="large-title">${esc(ex.name)}</div>
    <button class="lastbar" id="history">
      <span class="main"><span class="lb-label">${prevK ? `Last time · ${fmtShort(prevK)}` : 'Last time'}</span>
      <span class="lb-sets">${prevK ? prevSets.map(s => `<span style="white-space:nowrap">${W(s.weight)} ${U()} × ${s.reps}</span>`).join(', ') : 'No earlier sessions'}</span></span>
      <span class="lb-more">History <span class="chev">${ICON_CHEV}</span></span>
    </button>
    ${ex.instructions || vid ? `<details class="instr"><summary>Instructions</summary>
      ${ex.instructions ? `<div class="instr-text">${esc(ex.instructions)}</div>` : ''}
      ${vid ? `<a href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener">Watch video on YouTube ↗</a>` : ''}
    </details>` : ''}
    <div class="group">
      <div class="sets-head"><span>Set</span><span>${U()}</span><span>Reps</span><span></span></div>
      ${rows || '<div class="empty">No sets planned.</div>'}
    </div>
    <div class="stepper glass">
      <button id="minus" aria-label="Remove a set" ${canMinus ? '' : 'disabled'}>−</button>
      <span>${plural(n, 'set')}</span>
      <button id="plus" aria-label="Add a set">+</button>
    </div>
    ${!isFinished(state.selected) && (m.idx === m.total - 1 || setsLeft(state.selected) === 0)
      ? `<button class="primary finish-btn" id="finishHere">${svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 18, 2.6)}&nbsp;Finish workout</button>
         ${m.idx === m.total - 1 ? '<div class="footnote" style="text-align:center">Last exercise. Swipe left for more options.</div>' : ''}` : ''}`;
}

function finishBodyHTML(k) {

      <div class="large-title" style="text-align:center;margin-bottom:6px">${done ? 'Workout finished' : 'End of workout'}</div>
      <div class="finish-sub">${done ? `Finished in ${fmtMins(s.end - s.start)}` : left ? `${plural(left, 'planned set')} not logged yet` : 'Every planned set is logged'}</div>

}

// Page dots: one per exercise plus the end page. Tap one to jump there.
function dotsHTML(k, current) {
  const items = dayOf(k).items;
  const dots = items.map((it, i) => `<button class="pdot ${i === current ? 'on' : ''}" data-page="${i}" aria-label="Exercise ${i + 1}"></button>`).join('');
  return `<div class="pdots glass" role="tablist">${dots}<button class="pdot end ${current === items.length ? 'on' : ''}" data-page="${items.length}" aria-label="End of workout"></button></div>`;
}
// Page index i: 0..items-1 = exercises, items.length = end page
function pageHTML(k, i) {
  const items = dayOf(k).items;
  if (i < 0 || i > items.length) return null;
  return i === items.length ? finishBodyHTML(k) : logBodyHTML(logModel(k, i));
}
function goPage(k, i, slide) {
  const items = dayOf(k).items;
  if (i < 0 || i > items.length) return;
  if (i === items.length) go('finish', { slide });
  else go('log', { logExId: items[i].exId, slide });
}
function pagerShell(k, i, body) {
  return `
    <header class="nav">${backBtn(fmtShort(k))}<span class="spacer"></span>${timerHTML(k)}</header>
    <div class="swipe-area" id="swipeArea"><div class="pager" id="pager"><div class="slide-wrap ${state.slide ? 'from-' + state.slide : ''}">${body}</div></div></div>
    ${dotsHTML(k, i)}`;
}
function wirePager(k, i) {
  state.slide = null;
  $('back').onclick = () => go('day');
  wireTimer(k);
  app.querySelectorAll('[data-page]').forEach(b => b.onclick = () => { const j = Number(b.dataset.page); if (j !== i) goPage(k, j, j > i ? 'right' : 'left'); });
  const pager = $('pager');
  swipePager($('swipeArea'), pager, {
    peek: dir => pageHTML(k, i + dir),
    peekTop: () => Math.max(0, -pager.getBoundingClientRect().top + 56),
    commit: dir => goPage(k, i + dir, null),
  });
}

function renderLog() {
  const k = state.selected;
  const idx = dayOf(k).items.findIndex(it => it.exId === state.logExId);
  const m = idx >= 0 && logModel(k, idx);
  if (!m) return go('day');
  const { ex, bySlot, n, drafts } = m;
  const item = new Proxy({}, { get: (_, p) => realItem()[p], set: (_, p, v) => { realItem()[p] = v; return true; } });
  function realItem() { return ensureDay(k).items.find(it => it.exId === ex.id); }
  app.innerHTML = pagerShell(k, idx, logBodyHTML(m));
  wirePager(k, idx);

  const changed = () => { save(); state.pending = null; render(); };
  if ($('finishHere')) $('finishHere').onclick = () => openFinish(k);
  $('history').onclick = () => go('history', { stat: 'e1rm' });
  $('plus').onclick = () => { item.sets = n + 1; changed(); };
  $('minus').onclick = () => { if (!(n > 0 && !bySlot[n - 1])) return; item.sets = n - 1; delete drafts[n - 1]; changed(); };

  app.querySelectorAll('#pager .setrow').forEach(row => {
    const i = Number(row.dataset.i);
    const wIn = row.querySelector('.w'), rIn = row.querySelector('.r');
    const done = bySlot[i];
    [wIn, rIn].forEach(inp => {
      inp.addEventListener('focus', () => inp.select());
      inp.addEventListener('input', () => {
        inp.classList.remove('bad');
        if (!done) drafts[i] = { w: wIn.value, r: rIn.value };
      });
      // Editing a finished set saves the change when you leave the field
      if (done) inp.addEventListener('change', () => {
        const w = parseW(wIn.value), r = parseR(rIn.value);
        if (isNaN(w) || isNaN(r)) { render(); return; }
        done.weight = fromU(w); done.reps = r; save();
      });
    });
    row.querySelector('.check').onclick = () => {
      if (done) {
        drafts[i] = { w: W(done.weight), r: String(done.reps) };
        data.sets = data.sets.filter(s => s.id !== done.id);
        changed(); return;
      }
      const w = parseW(wIn.value), r = parseR(rIn.value);
      if (isNaN(w)) wIn.classList.add('bad');
      if (isNaN(r)) rIn.classList.add('bad');
      if (isNaN(w) || isNaN(r)) return;
      data.sets.push({ id: uid(), exId: ex.id, date: k, slot: i, weight: fromU(w), reps: r, ts: Date.now() });
      delete drafts[i];
      if (i + 1 > (item.sets || 0)) item.sets = i + 1;
      const d = ensureDay(k);
      if (!d.session) d.session = { start: Date.now() }; // first logged set starts the timer
      changed();
    };
  });
}

/* ================= Finger-following swipe ================= */
// The target moves with your finger (you can pause mid-swipe); the neighbouring page peeks in from the side.
// Let go past ~30% of the width, or flick, to turn the page; otherwise it springs back.
function swipePager(surface, target, opts) {
  let s = null;
  const ease = 'transform .28s cubic-bezier(.2,.85,.3,1)';
  const clearPeek = () => { if (s && s.peek) { s.peek.remove(); s.peek = null; } };
  surface.addEventListener('touchstart', e => {
    if (e.touches.length > 1 || e.target.closest('input, textarea, .chart, .grip')) { s = null; return; }
    const t = e.touches[0];
    s = { x: t.clientX, y: t.clientY, axis: null, dir: 0, dx: 0, peek: null, lx: t.clientX, lt: performance.now(), v: 0 };
    target.style.transition = 'none';
  }, { passive: true });
  surface.addEventListener('touchmove', e => {
    if (!s) return;
    const t = e.touches[0];
    const dx = t.clientX - s.x, dy = t.clientY - s.y;
    if (!s.axis) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      s.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (s.axis !== 'x') return;
    e.preventDefault();
    const now = performance.now();
    s.v = (t.clientX - s.lx) / Math.max(1, now - s.lt); s.lx = t.clientX; s.lt = now;
    const dir = dx < 0 ? 1 : -1;
    if (dir !== s.dir) {
      s.dir = dir;
      clearPeek();
      const html = opts.peek(dir);
      if (html != null) {
        const p = document.createElement('div');
        p.className = 'peek';
        p.setAttribute('aria-hidden', 'true');
        p.innerHTML = html;
        p.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
        p.style.left = dir > 0 ? 'calc(100% + 16px)' : 'calc(-100% - 16px)';
        p.style.top = (opts.peekTop ? opts.peekTop() : 0) + 'px';
        target.appendChild(p);
        s.peek = p;
      }
    }
    s.dx = s.peek ? dx : dx * 0.25; // rubber-band when there's nothing on that side
    target.style.transform = `translateX(${s.dx}px)`;
  }, { passive: false });
  const end = () => {
    if (!s || s.axis !== 'x') { s = null; return; }
    const w = target.offsetWidth;
    const flick = Math.abs(s.v) > 0.45 && Math.sign(-s.v) === s.dir && Math.abs(s.dx) > 50;
    const st = s;
    s = null;
    target.style.transition = ease;
    if (st.peek && (Math.abs(st.dx) > w * 0.3 || flick)) {
      target.style.transform = `translateX(${-st.dir * (w + 16)}px)`;
      setTimeout(() => opts.commit(st.dir), 280);
    } else {
      target.style.transform = '';
      setTimeout(() => { if (st.peek) st.peek.remove(); }, 280);
    }
  };
  surface.addEventListener('touchend', end);
  surface.addEventListener('touchcancel', end);
}

/* ================= Session timer ================= */
let timerTick = null;
const fmtDur = ms => {
  const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
};
const fmtMins = ms => { const m = Math.round(ms / 60000), h = Math.floor(m / 60); return h ? `${h} h ${m % 60} min` : `${m} min`; };
const setsLeft = k => dayOf(k).items.reduce((a, it) => a + Math.max(0, (it.sets || 0) - setsFor(it.exId, k).length), 0);

// The timer runs until "Finish workout" (end page or tapping the running timer).
function timerHTML(k) {
  const s = dayOf(k).session;
  if (!s) return `<button class="capsule glass timer" id="timer" aria-label="Start session timer">${ICON_TIMER}<span>Start</span></button>`;
  if (s.end) return `<button class="capsule glass timer ended" id="timer" aria-label="Workout finished, tap to change duration">${ICON_OK}<span>${fmtMins(s.end - s.start)}</span></button>`;

/* Finish workout: confirm the duration to the minute, and offer to log sets that were filled in but not ticked */
function untickedSets(k) {
  const out = [];
  dayOf(k).items.forEach((it, idx) => {
    const m = logModel(k, idx); if (!m) return;
    for (let i = 0; i < m.n; i++) {

      const v = suggest(m, i), w = parseW(v.w), r = parseR(v.r);

  });

}
const isFinished = k => { const s = dayOf(k).session; return !!(s && s.end); };
const openFinish = k => openSheet({ type: 'duration', k });
function sheetDuration(el) {
  const st = state.sheet, k = st.k;
  const day = dayOf(k);
  const s = day.session;
  const editing = s && s.end;
  const loggedToday = data.sets.filter(x => x.date === k);
  const unticked = editing ? [] : untickedSets(k);
  const okUnticked = unticked.filter(u => u.ok);
  if (st.logRest === undefined) st.logRest = okUnticked.length > 0;
  // Default duration: the timer, or (if it never ran) the time since the first logged set
  const firstTs = loggedToday.length ? Math.min(...loggedToday.map(x => x.ts)) : null;
  const ms = s ? (s.end || Date.now()) - s.start : firstTs && k === todayKey() ? Date.now() - firstTs : 0;
  const mins = Math.max(0, Math.round(ms / 60000));
  const nothing = !loggedToday.length && !(st.logRest && okUnticked.length);
  el.innerHTML = sheetOpen('Finish workout',
    `${closeBtn('sCancel')}<b>${editing ? 'Duration' : 'Finish workout'}</b>${okBtn('sSave', editing ? 'Save duration' : 'Finish workout')}`,
    `${!editing ? `
      <div class="finish-summary">${plural(loggedToday.length, 'set')} logged${unticked.length ? ` · ${plural(unticked.length, 'set')} not ticked` : ''}</div>
      ${okUnticked.length ? `
        <div class="group"><label class="set-row"><span class="lbl">Log the ${plural(okUnticked.length, 'unticked set')} as shown</span><input type="checkbox" class="switch" id="logRest" ${st.logRest ? 'checked' : ''}></label></div>
        <div class="footnote">Uses the weight and reps shown in each row.${unticked.length > okUnticked.length ? ` ${plural(unticked.length - okUnticked.length, 'set')} without numbers will be skipped.` : ''}</div>` : ''}
      ${nothing ? `<div class="footnote" style="color:var(--red)">No sets are logged, so this workout will show as empty. ${okUnticked.length ? 'Tick the sets you did, or log them above.' : 'Tick the sets you did first.'}</div>` : ''}
      <div class="section">Duration</div>` : ''}
     <div class="finish-sub" style="margin:0 6px 4px">${s ? `Started ${new Date(s.start).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}` : "The timer wasn't running"} · adjust if needed</div>
     <div class="group"><div class="wheels dur">
       ${wheelHTML('wH', HOUR_OPTS)}<span class="unit">h</span>${wheelHTML('wM', MIN_OPTS)}<span class="unit">min</span>
     </div></div>`);
  initWheel('wH', Math.min(9, Math.floor(mins / 60)));

  if ($('logRest')) $('logRest').onchange = e => { st.logRest = e.target.checked; st.h = wheelIndex('wH'); st.m = wheelIndex('wM'); renderSheet(); initWheel('wH', st.h); initWheel('wM', st.m); };
  $('sCancel').onclick = () => closeSheet();

    const d = ensureDay(k);
    if (!editing && st.logRest) {
      let ts = Date.now();
      okUnticked.forEach(u => {

        delete (state.drafts[u.exId + '|' + k] || {})[u.slot];

    const end = s && s.end ? s.end : Date.now();
    d.session = { start: end - total, end };

    // TODO: show a workout summary here
    go('day');
  };
}

const STATS = [
  { key: 'e1rm', label: 'Est. 1RM', get unit() { return U(); } },
  { key: 'heaviest', label: 'Heaviest', get unit() { return U(); } },
  { key: 'volume', label: 'Volume', get unit() { return U(); } },
  { key: 'reps', label: 'Reps', unit: 'reps' },
];
function seriesFor(exId, key) {
  const byDate = {};
  (state.statSrc || data.sets).filter(s => s.exId === exId).forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });
  return Object.keys(byDate).sort().map(k => {
    const ss = byDate[k];
    let v, note;
    if (key === 'e1rm') { const best = ss.reduce((a, s) => (e1rm(s) > e1rm(a) ? s : a)); v = toU(e1rm(best)); note = `from ${W(best.weight)} × ${best.reps}`; }
    else if (key === 'heaviest') { v = toU(Math.max(...ss.map(s => s.weight))); note = plural(ss.length, 'set'); }
    else if (key === 'volume') { v = toU(ss.reduce((a, s) => a + s.weight * s.reps, 0)); note = plural(ss.length, 'set'); }
    else { v = ss.reduce((a, s) => a + s.reps, 0); note = plural(ss.length, 'set'); }
    return { k, t: parse(k).getTime(), v, note };
  });
}
const fmtStat = (v, key) => key === 'volume' || key === 'reps' ? Math.round(v).toLocaleString('en-GB') : (Math.round(v * 10) / 10).toFixed(1);

function progressHTML(exId) {
  const stat = STATS.find(s => s.key === state.stat);
  const pts = seriesFor(exId, stat.key);
  const last = pts[pts.length - 1];
  const best = pts.length ? Math.max(...pts.map(p => p.v)) : 0;
  const diff = pts.length > 1 ? last.v - pts[0].v : 0;
  return `
    <div class="seg">${STATS.map(s => `<button data-s="${s.key}" class="${s.key === stat.key ? 'on' : ''}">${s.label}</button>`).join('')}</div>
    <div class="card">
      ${pts.length ? `
        <div class="hsub">Latest · ${fmtShort(last.k)}</div>
        <div class="headline">${fmtStat(last.v, stat.key)}<small>${stat.unit}</small></div>
        ${pts.length > 1 ? `<div class="hsub"><span class="${diff > 0 ? 'hsub up' : ''}">${diff >= 0 ? '+' : '−'}${fmtStat(Math.abs(diff), stat.key)} ${stat.unit}</span> since ${fmtTiny(pts[0].k)} · Best ${fmtStat(best, stat.key)}</div>` : ''}` : ''}
      <div class="chart" id="chart"></div>
    </div>
    ${stat.key === 'e1rm' && pts.length ? '<div class="footnote">Best set of each session, estimated with the Wathan formula. Most accurate for sets of about 10 reps or fewer.</div>' : ''}`;
}

function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.floor(lo / step) * step; ; v += step) { out.push(+v.toFixed(6)); if (v >= hi - 1e-9) break; }
  return out;
}
function drawChart(box, pts, stat) {
  if (!pts.length) { box.style.height = 'auto'; box.style.margin = '0'; box.innerHTML = '<div style="color:var(--label2);padding:20px 0;text-align:center">Log some sets to see your progress here.</div>'; return; }
  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const tint = C('--tint'), gridC = C('--grid'), axis = C('--label2'), ring = C('--card');
  const W = box.clientWidth, H = 210, L = 38, R = 8, T = 34, B = 22;
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { const p = Math.max(1, Math.abs(lo) * 0.05); lo -= p; hi += p; }
  const ticks = niceTicks(lo, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const x = t => t1 === t0 ? L + (W - L - R) / 2 : L + ((t - t0) / (t1 - t0)) * (W - L - R);
  const y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const tickFmt = v => stat.key === 'volume' && y1 >= 10000 ? `${Math.round(v / 1000)}k` : fmtW(v);
  const grid = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${gridC}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${axis}">${tickFmt(v)}</text>`).join('');
  const xl = pts.length > 1
    ? `<text x="${L}" y="${H - 4}" font-size="11" fill="${axis}">${fmtTiny(pts[0].k)}</text><text x="${W - R}" y="${H - 4}" text-anchor="end" font-size="11" fill="${axis}">${fmtTiny(pts[pts.length - 1].k)}</text>`
    : `<text x="${x(t0)}" y="${H - 4}" text-anchor="middle" font-size="11" fill="${axis}">${fmtTiny(pts[0].k)}</text>`;
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const dots = pts.map(p => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="4" fill="${tint}" stroke="${ring}" stroke-width="2"/>`).join('');
  box.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${stat.label} over time">
      ${grid}${xl}
      <defs><linearGradient id="fillG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${tint}" stop-opacity=".22"/><stop offset="1" stop-color="${tint}" stop-opacity="0"/></linearGradient></defs>
      ${pts.length > 1 ? `<path d="${d}L${x(t1).toFixed(1)},${H - B}L${x(t0).toFixed(1)},${H - B}Z" fill="url(#fillG)"/>` : ''}
      <path d="${d}" fill="none" stroke="${tint}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      <line id="cross" y1="${T - 4}" y2="${H - B}" stroke="${axis}" stroke-opacity=".5" visibility="hidden"/>
      <circle id="focus" r="6" fill="${tint}" stroke="${ring}" stroke-width="2" visibility="hidden"/>
      <rect id="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    </svg><div class="tip glass" id="tip" hidden></div>`;
  const hit = box.querySelector('#hit'), cross = box.querySelector('#cross'), focus = box.querySelector('#focus'), tip = box.querySelector('#tip');
  const show = e => {
    const mx = e.clientX - hit.getBoundingClientRect().left;
    let p = pts[0];
    for (const q of pts) if (Math.abs(x(q.t) - mx) < Math.abs(x(p.t) - mx)) p = q;
    const px = x(p.t), py = y(p.v);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    focus.setAttribute('cx', px); focus.setAttribute('cy', py); focus.setAttribute('visibility', 'visible');
    tip.hidden = false;
    tip.innerHTML = `<b>${fmtStat(p.v, stat.key)} ${stat.unit}</b> · ${fmtTiny(p.k)} · ${p.note}`;
    const half = tip.offsetWidth / 2;
    tip.style.left = Math.max(half, Math.min(W - half, px)) + 'px';
  };
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointermove', show);
}

/* ================= Plans (rotation) ================= */
// A plan is a rotation of days (Day 1, Day 2, …; rest days count) that runs on the calendar from a
// start date and repeats. Only one plan is active at a time. Planned days are read from the plan
// until you touch them; once you log a set or change a day it becomes that day's own copy.
// Moving/shifting inserts gap days (positive) or skips ahead (negative) from a date onwards.
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const planById = id => data.plans.find(p => p.id === id);
const activePlan = () => (data.activePlan && planById(data.activePlan.planId)) ? data.activePlan : null;
function planEnd(ap, plan) {
  if (!plan.weeks) return null;
  const extra = (ap.shifts || []).reduce((a, s) => a + s.by, 0);
  return dk(addDays(parse(ap.begin), plan.weeks * 7 + extra));
}
function planDayFor(k) {
  const ap = activePlan(); if (!ap) return null;
  const plan = planById(ap.planId); const len = plan.days.length;
  if (!len || k < ap.begin) return null;
  const end = planEnd(ap, plan); if (end && k >= end) return null;
  let off = 0;
  for (const s of [...(ap.shifts || [])].sort((a, b) => (a.from < b.from ? -1 : 1))) {
    if (k < s.from) continue;
    if (s.by > 0 && daysBetween(s.from, k) < s.by) return { plan, ap, index: -1, workout: null, moved: true };
    off += s.by;
  }
  const n = daysBetween(ap.start, k) - off;
  if (n < 0) return { plan, ap, index: -1, workout: null, moved: true };
  const index = n % len;
  return { plan, ap, index, cycle: Math.floor(n / len) + 1, workout: woById(plan.days[index].workoutId) || null };
}
function virtualDay(k) {
  const pd = planDayFor(k);
  if (!pd || !pd.workout) return null;
  return { items: pd.workout.items.filter(i => exById(i.exId)).map(i => ({ exId: i.exId, sets: i.sets })),
           workouts: [{ id: pd.workout.id, name: pd.workout.name }], plan: { id: pd.plan.id, index: pd.index } };
}
const planDayLabel = (plan, i) => { const w = woById(plan.days[i].workoutId); return w ? w.name : 'Rest'; };
const planSummary = p => `${p.days.length}-day rotation · ${plural(p.days.filter(d => woById(d.workoutId)).length, 'workout')} · ${p.weeks ? plural(p.weeks, 'week') : 'ongoing'}`;

// Move a planned day (and everything after it) later by n days
function shiftPlan(from, by) {
  const ap = activePlan(); if (!ap || !by) return;
  ap.shifts = ap.shifts || [];
  ap.shifts.push({ from, by });
  // Days that were only filled in from the plan (nothing logged) are recalculated
  for (const k in data.days) {
    if (k >= from && data.days[k].plan && !data.sets.some(s => s.date === k) && !data.days[k].session) delete data.days[k];
  }
}

  };
}

      if (!state.sheet || state.sheet.type !== 'signin') render();
    });
    cloud.ready = true;
  } catch (e) {
    cloud.ready = false;
    setCloudStatus('error', 'could not load sign-in (are you offline?)');
  }
  window.addEventListener('online', () => { if (cloud.user) pushChanges(); });
}

// The data on this device belongs to one account. If a different account signs in here,
// put the previous person's data aside (kept on this device) instead of uploading it to the new account.
function claimLocalData(uid) {
  let owner = null;
  try { owner = localStorage.getItem('tt.owner'); } catch (e) {}
  if (owner && owner !== uid) {
    try {
      localStorage.setItem('tt.v1.' + owner, JSON.stringify(data));
      const mine = JSON.parse(localStorage.getItem('tt.v1.' + uid) || 'null');
      data = migrate(mine || { exercises: [], days: {}, sets: [], workouts: [], settings: data.settings });
      state.drafts = {};
    } catch (e) {}
  }
  try { localStorage.setItem('tt.owner', uid); } catch (e) {}
}

async function startSync() {
  const fb = cloud.fb, uid = cloud.user.uid;
  claimLocalData(uid);
  if (!data.settings.name && cloud.user.displayName) { data.settings.name = cloud.user.displayName; save(); }
  cloud.sync = loadSync(uid);
  setCloudStatus('connecting');
  try {
    if (!cloud.sync) {
      // First time this device signs in to this account: download everything once and merge it in
      cloud.sync = { since: 0, maps: {} };
      for (const col of Object.keys(COLS)) {
        cloud.sync.maps[col] = {};
        const snap = await fb.getDocs(fb.collection(cloud.db, 'users', uid, col));
        const local = COLS[col].get();
        snap.forEach(d => {
          const v = d.data();
          cloud.sync.since = Math.max(cloud.sync.since, v.u || 0);
          if (v.deleted) { delete local[d.id]; return; }
          const rec = stripRec(v);
          local[d.id] = rec;                                   // the account's copy wins on a clash
          cloud.sync.maps[col][d.id] = hash(JSON.stringify(rec));
        });
        COLS[col].set(local);
      }
      saveSync();
      saveLocal();
      if (!state.sheet) render();
    }
    listen();
    startFriends();
    await pushChanges();                                       // upload anything only this device has
  } catch (e) {
    setCloudStatus(navigator.onLine ? 'error' : 'offline', e.code || e.message);
  }
}

// Live updates from your other devices
function listen() {
  const fb = cloud.fb, uid = cloud.user.uid;
  const since = Math.max(0, (cloud.sync.since || 0) - 5 * 60 * 1000); // small margin for clock differences
  for (const col of Object.keys(COLS)) {
    const q = fb.query(fb.collection(cloud.db, 'users', uid, col), fb.where('u', '>', since));
    cloud.unsubs.push(fb.onSnapshot(q, snap => {
      let changed = false;
      const local = COLS[col].get();
      const map = cloud.sync.maps[col] = cloud.sync.maps[col] || {};
      snap.docChanges().forEach(ch => {
        if (ch.doc.metadata.hasPendingWrites || ch.type === 'removed') return; // our own write echoing back
        const v = ch.doc.data();
        cloud.sync.since = Math.max(cloud.sync.since, v.u || 0);
        if (v.deleted) { if (local[ch.doc.id]) { delete local[ch.doc.id]; changed = true; } delete map[ch.doc.id]; return; }
        const rec = stripRec(v), h = hash(JSON.stringify(rec));
        if (map[ch.doc.id] === h && local[ch.doc.id]) return;
        local[ch.doc.id] = rec; map[ch.doc.id] = h; changed = true;
      });
      saveSync();
      if (changed) {
        COLS[col].set(local);
        if (col === 'meta') applyTheme();
        saveLocal();
        const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
        if (!typing && !state.sheet) render();
      }
      if (!snap.metadata.fromCache && cloud.status !== 'syncing') setCloudStatus('synced');
    }, e => setCloudStatus('error', e.code || e.message)));
  }
}
function stopListening() { cloud.unsubs.forEach(u => u()); cloud.unsubs = []; }

// Send local changes (compares each record with what was last synced)
function scheduleSync() { if (!cloud.user || !cloud.sync) return; clearTimeout(cloud.timer); cloud.timer = setTimeout(pushChanges, 600); }
async function pushChanges() {
  if (!cloud.user || !cloud.sync) return;
  const fb = cloud.fb, uid = cloud.user.uid, now = Date.now();
  const ops = [];
  for (const col of Object.keys(COLS)) {
    const local = COLS[col].get();
    const map = cloud.sync.maps[col] = cloud.sync.maps[col] || {};
    for (const id in local) {
      const h = hash(JSON.stringify(local[id]));
      if (map[id] !== h) ops.push({ col, id, body: { ...JSON.parse(JSON.stringify(local[id])), u: now }, h });
    }
    for (const id in map) if (!(id in local)) ops.push({ col, id, body: { deleted: true, u: now }, h: null });
  }
  if (!ops.length) { if (cloud.status !== 'error') setCloudStatus(navigator.onLine ? 'synced' : 'offline'); return; }
  setCloudStatus('syncing');
  try {
    for (let i = 0; i < ops.length; i += 400) {
      const batch = fb.writeBatch(cloud.db);
      ops.slice(i, i + 400).forEach(o => batch.set(fb.doc(cloud.db, 'users', uid, o.col, o.id), o.body));
      // Mark as synced right away: Firestore keeps queued writes and sends them when back online
      ops.slice(i, i + 400).forEach(o => { if (o.h) cloud.sync.maps[o.col][o.id] = o.h; else delete cloud.sync.maps[o.col][o.id]; });
      saveSync();
      if (navigator.onLine) await batch.commit(); else batch.commit().catch(() => {});
    }
    setCloudStatus(navigator.onLine ? 'synced' : 'offline');
  } catch (e) {
    setCloudStatus(navigator.onLine ? 'error' : 'offline', e.code || e.message);
  }
}

function friendlyAuthError(e) {
  const c = (e && e.code) || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'Wrong email or password.';
  if (c.includes('email-already-in-use')) return 'There is already an account with that email. Sign in instead.';
  if (c.includes('weak-password')) return 'Use at least 6 characters for the password.';
  if (c.includes('invalid-email')) return "That email address doesn't look right.";
  if (c.includes('popup-closed') || c.includes('cancelled-popup')) return '';
  if (c.includes('network')) return "Couldn't reach the server. Check your connection.";
  if (c.includes('unauthorized-domain')) return 'This web address is not allowed yet (add it under Authentication → Settings → Authorized domains).';
  if (c.includes('operation-not-allowed')) return 'This sign-in method is turned off in Firebase.';
  if (c.includes('too-many-requests')) return 'Too many attempts. Wait a moment and try again.';
  return 'Sign-in failed (' + (c || e.message || 'unknown error') + ').';
}

// Friends are a symmetric link between two people (links/{uidA_uidB}). Each person controls their own
// switches on the link: share[myUid] = whether the other person can see my training (read-only).
// Invites use a short code (codes/{CODE} → uid + name) or a link to the app with #add-CODE.
const friends = { links: [], unsub: null, cache: {}, exCache: {}, error: '', nameTimer: null };
const pairId = (a, b) => (a < b ? a + '_' + b : b + '_' + a);
const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

const fmtCode = c => (c ? c.slice(0, 3) + '-' + c.slice(3) : '');

function startFriends() {
  const fb = cloud.fb, uid = cloud.user.uid;
  friends.error = '';
  ensureCode();
  friends.unsub = fb.onSnapshot(fb.query(fb.collection(cloud.db, 'links'), fb.where('members', 'array-contains', uid)), snap => {
    friends.links = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    friends.links.forEach(l => { if (!l.names || l.names[uid] !== myName()) fb.updateDoc(fb.doc(cloud.db, 'links', l.id), { ['names.' + uid]: myName(), u: Date.now() }).catch(() => {}); });

  }, e => { friends.error = isPerm(e) ? 'rules' : (e.code || e.message); if (state.tab === 'friends') render(); });
  if (state.inviteCode) openSheet({ type: 'addFriend', code: state.inviteCode, auto: true }), (state.inviteCode = null);

// Each account gets one friend code, reserved in codes/{CODE}
// Your code is worked out from your account id, so every device shows the same code and it never changes.
// (If that code is ever taken by someone else, the next variant is used.)
function codeFor(uid, variant) {
  const h = (str, seed) => { let x = seed >>> 0; for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; } return x; };
  const a = h(uid + ':' + variant, 2166136261), b = h(variant + ':' + uid, 374761393);
  let out = '';
  for (let i = 0; i < 6; i++) out += CODE_ABC[((i < 3 ? a >>> (i * 5) : b >>> ((i - 3) * 5))) & 31];
  return out;
}
async function ensureCode() {
  const fb = cloud.fb, uid = cloud.user.uid;
  try {
    for (let v = 0; v < 6; v++) {
      const code = codeFor(uid, v);
      const ref = fb.doc(cloud.db, 'codes', code);
      const ex = await fb.getDoc(ref);
      if (ex.exists() && ex.data().uid !== uid) continue;   // taken by someone else
      await fb.setDoc(ref, { uid, name: myName() });
      const old = data.settings.code;
      if (old !== code) {
        // Release an older random code from before this fix, if it's ours
        if (old) fb.getDoc(fb.doc(cloud.db, 'codes', old)).then(d => { if (d.exists() && d.data().uid === uid) fb.deleteDoc(d.ref || fb.doc(cloud.db, 'codes', old)); }).catch(() => {});
        data.settings.code = code; save();
      }
      if (state.tab === 'friends') render();
      return;
    }
  } catch (e) {
    friends.error = isPerm(e) ? 'rules' : (e.code || e.message);
    if (state.tab === 'friends') render();
  }
}

  if (ex.exists()) {
    const l = { id, ...ex.data() };
    if (l.status === 'pending' && l.from === other) return acceptFriend(l, share);   // they already asked you
    throw new Error(l.status === 'accepted' ? "You're already friends." : 'Request already sent.');
  }
  await fb.setDoc(ref, { members: [me, other].sort(), from: me, status: 'pending', share: { [me]: !!share }, names: { [me]: myName(), [other]: otherName || 'Friend' }, u: Date.now() });
}
const acceptFriend = (l, share) => cloud.fb.updateDoc(cloud.fb.doc(cloud.db, 'links', l.id), { status: 'accepted', ['share.' + cloud.user.uid]: !!share, ['names.' + cloud.user.uid]: myName(), u: Date.now() });
const setShare = (l, on) => cloud.fb.updateDoc(cloud.fb.doc(cloud.db, 'links', l.id), { ['share.' + cloud.user.uid]: on, u: Date.now() });
const removeLink = l => cloud.fb.deleteDoc(cloud.fb.doc(cloud.db, 'links', l.id));

// A friend's training (read-only): exercises + the last 120 days of sets and days
async function loadFriend(uid, force) {
  const c = friends.cache[uid];
  if (c && !force && Date.now() - c.at < 60 * 1000) return c;
  const fb = cloud.fb, col = n => fb.collection(cloud.db, 'users', uid, n);
  const cutoff = dk(addDays(new Date(), -120));
  const [ex, sets, days] = await Promise.all([
    fb.getDocs(col('exercises')),
    fb.getDocs(fb.query(col('sets'), fb.where('date', '>=', cutoff))),
    fb.getDocs(fb.query(col('days'), fb.where(fb.documentId(), '>=', cutoff))),
  ]);
  const live = s => s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => !x.deleted);
  const out = { exercises: live(ex), sets: live(sets), days: Object.fromEntries(live(days).map(d => [d.id, d])), at: Date.now() };
  friends.cache[uid] = out;
  return out;
}
async function loadFriendExercise(uid, exId) {
  const key = uid + '|' + exId;
  if (friends.exCache[key] && Date.now() - friends.exCache[key].at < 5 * 60 * 1000) return friends.exCache[key].sets;
  const fb = cloud.fb;
  const snap = await fb.getDocs(fb.query(fb.collection(cloud.db, 'users', uid, 'sets'), fb.where('exId', '==', exId)));
  const sets = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => !x.deleted);
  friends.exCache[key] = { sets, at: Date.now() };
  return sets;
}
