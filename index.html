<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<!-- Only the app's own code may run (plus Google sign-in); blocks injected scripts even if some text slips through -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://workout-tracker-705ae.firebaseapp.com; frame-src https://workout-tracker-705ae.firebaseapp.com https://accounts.google.com https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" id="themeColor">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7; --card: #fff; --card2: #f2f2f7; --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.15); --fill: rgba(118,118,128,.12); --fill2: rgba(118,118,128,.2); --pressed: rgba(0,0,0,.05);
    --tint: #007aff; --tint-soft: rgba(0,122,255,.12); --red: #ff3b30; --red-soft: rgba(255,59,48,.12); --green: #34c759; --green-soft: rgba(52,199,89,.12);
    --spring: cubic-bezier(.32,.72,0,1);      /* iOS sheet / navigation curve */
    --bounce: cubic-bezier(.34,1.56,.64,1);   /* small controls springing back */
    --bounce-soft: cubic-bezier(.3,1.25,.5,1);
    --on-tint: #fff; --fill-faint: rgba(118,118,128,.06); --seg-on: #fff; --grid: rgba(60,60,67,.12);
    --glass: rgba(255,255,255,.72); --glass-edge: rgba(255,255,255,.9);
    --glass-shadow: 0 10px 30px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
    --backdrop: rgba(0,0,0,.25);
    --r: 22px; --sheet-bg: var(--bg); --sheet-card: var(--card);
    --rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
      --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.32); --pressed: rgba(255,255,255,.06);
      --tint: #0a84ff; --tint-soft: rgba(10,132,255,.2); --red: #ff453a; --red-soft: rgba(255,69,58,.2); --green: #30d158; --green-soft: rgba(48,209,88,.16);
      --seg-on: #636366; --fill-faint: rgba(118,118,128,.12); --grid: rgba(235,235,245,.12);
      --glass: rgba(37,37,40,.68); --glass-edge: rgba(255,255,255,.12);
      --glass-shadow: 0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
      --backdrop: rgba(0,0,0,.5); --sheet-bg: #1c1c1e; --sheet-card: #2c2c2e;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="system"] {
      --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.32); --pressed: rgba(255,255,255,.06);
      --tint: #0a84ff; --tint-soft: rgba(10,132,255,.2); --red: #ff453a; --red-soft: rgba(255,69,58,.2); --green: #30d158; --green-soft: rgba(48,209,88,.16);
      --seg-on: #636366; --fill-faint: rgba(118,118,128,.12); --grid: rgba(235,235,245,.12);
      --glass: rgba(37,37,40,.68); --glass-edge: rgba(255,255,255,.12);
      --glass-shadow: 0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
      --backdrop: rgba(0,0,0,.5); --sheet-bg: #1c1c1e; --sheet-card: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--label); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 17px; letter-spacing: -.01em;
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
  }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; }
  input, textarea { font: inherit; letter-spacing: inherit; color: var(--label); }
  #app { max-width: 600px; margin: 0 auto; padding: 0 16px calc(120px + env(safe-area-inset-bottom)); }

  /* Glass controls */
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
           box-shadow: var(--glass-shadow), inset 0 0 0 .5px var(--glass-edge); }
  .circle { width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--label); flex: none; transition: transform .5s var(--bounce); }
  .circle.prominent { background: var(--tint); color: var(--on-tint); box-shadow: 0 6px 16px rgba(0,122,255,.3); }
  .capsule { height: 44px; padding: 0 18px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; color: var(--label); flex: none; transition: transform .5s var(--bounce); }
  .circle:active, .capsule:active { transform: scale(.9); transition: transform .12s ease-out; }
  .pair { display: inline-flex; border-radius: 22px; height: 44px; }
  .pair button { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--label); }
  .pair button:active { opacity: .5; }

  /* Navigation bar */
  .nav { display: flex; align-items: center; gap: 8px; height: 56px; }
  .nav .title { font-weight: 600; font-size: 17px; }
  .spacer { flex: 1; }
  .large-title { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 14px; line-height: 1.12; }
  .section { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 30px 2px 12px; color: var(--label); }
  .section .opt { font-size: 15px; font-weight: 400; color: var(--label2); letter-spacing: 0; }
  .sheet .section { font-size: 15px; font-weight: 600; color: var(--label2); margin: 20px 6px 8px; letter-spacing: 0; }
  .footnote { font-size: 13px; color: var(--label2); margin: 10px 6px 0; line-height: 1.35; }

  /* Lists */
  .group { background: var(--card); border-radius: var(--r); overflow: hidden; }
  .group + .group { margin-top: 14px; }
  .cell { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 14px 18px; text-align: left; position: relative; }
  .cell { transition: background .35s ease-out; }
  .cell:active:not(:disabled) { background: var(--pressed); transition: none; }
  .cell + .cell::before, .cell-wrap + .cell-wrap::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; border-top: .5px solid var(--sep); }
  .cell-wrap { position: relative; }
  .cell .main { flex: 1; min-width: 0; font-weight: 500; }
  .cell .sub { font-size: 15px; color: var(--label2); margin-top: 2px; font-weight: 400; }
  .cell .detail { color: var(--label2); font-variant-numeric: tabular-nums; }
  .chev { color: var(--label3); flex: none; display: inline-flex; }
  .cell.action { color: var(--tint); font-weight: 500; }
  .cell.action .plus { width: 26px; height: 26px; border-radius: 50%; background: var(--tint-soft); display: inline-flex; align-items: center; justify-content: center; }
  .cell.destructive { color: var(--red); justify-content: center; font-weight: 500; }
  .cell.destructive.confirm { background: var(--red-soft); font-weight: 600; }
  .cell:disabled { color: var(--label3); }
  .empty { color: var(--label2); padding: 16px 18px; }
  .err { color: var(--red); font-size: 14px; margin: 10px 6px 0; }
  .err:empty { display: none; }

  /* Big tinted buttons */
  .btn-tinted { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: 26px; background: var(--tint-soft); color: var(--tint); font-weight: 600; margin-top: 14px; transition: transform .5s var(--bounce); }
  .btn-tinted:active, .primary:active { transform: scale(.96); transition: transform .12s ease-out; }
  .primary { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; background: var(--tint); color: var(--on-tint); border-radius: 26px; font-weight: 600; margin-top: 16px; transition: transform .5s var(--bounce); }

  /* Search field */
  .search { display: flex; align-items: center; gap: 8px; background: var(--fill); border-radius: 22px; padding: 0 14px; height: 44px; margin-bottom: 14px; color: var(--label2); }
  .search input { flex: 1; border: 0; background: none; outline: none; font-size: 17px; height: 100%; padding: 0; -webkit-appearance: none; }
  .search input::placeholder { color: var(--label2); }
  .search input::-webkit-search-cancel-button { display: none; }

  /* Week strip */
  .weekhead { display: flex; align-items: center; gap: 8px; height: 56px; }
  .weekhead .title { font-size: 26px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .weekhead .title .yr { color: var(--label2); font-weight: 600; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 6px 0 22px; touch-action: pan-y; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 8px; border-radius: 22px; transition: background .2s; }
  .day:active { background: var(--fill); }
  .day .wd { font-size: 12px; color: var(--label2); font-weight: 600; }
  .day .num { font-family: var(--rounded); font-size: 20px; font-weight: 600; line-height: 24px; }
  .day.today .num, .day.today .wd { color: var(--red); }
  .day.sel { background: var(--label); }
  .day.sel .wd, .day.sel .num { color: var(--bg); }
  .day.sel.today { background: var(--red); }
  .day.sel.today .wd, .day.sel.today .num { color: #fff; }
  .dot { width: 5px; height: 5px; border-radius: 50%; }
  .dot.on { background: var(--label3); }
  .day.sel .dot.on { background: var(--bg); opacity: .7; }
  .day.sel.today .dot.on { background: #fff; }
  .day-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 0 2px 2px; }
  .day-sub { color: var(--label2); font-size: 15px; margin: 0 2px 14px; }

  /* Last-time card */
  .lastbar { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border-radius: var(--r); padding: 14px 16px 14px 18px; margin-bottom: 14px; }
  .lastbar:active { background: var(--card2); }
  .lastbar .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .lb-label { font-size: 13px; color: var(--label2); font-weight: 500; }
  .lb-sets { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .lb-more { font-size: 15px; color: var(--tint); font-weight: 500; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
  .lb-more .chev { color: var(--tint); }

  details.instr { background: var(--card); border-radius: var(--r); margin-bottom: 14px; padding: 0 18px; }
  details.instr summary { padding: 15px 0; color: var(--tint); font-weight: 500; cursor: pointer; list-style: none; }
  details.instr summary::-webkit-details-marker { display: none; }
  details.instr[open] summary { border-bottom: .5px solid var(--sep); }
  .instr-text { white-space: pre-wrap; padding: 14px 0; line-height: 1.45; }
  details.instr a { display: inline-block; padding: 0 0 14px; font-weight: 500; }

  /* Set rows */
  .sets-head, .setrow { display: grid; grid-template-columns: 30px 1fr 1fr 48px; gap: 10px; align-items: center; padding: 0 10px 0 18px; }
  .sets-head { font-size: 13px; color: var(--label2); font-weight: 600; height: 40px; padding-top: 6px; }
  .sets-head span:nth-child(2), .sets-head span:nth-child(3) { text-align: center; }
  .setrow { min-height: 60px; position: relative; transition: background .2s; }
  .setrow + .setrow::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; border-top: .5px solid var(--sep); }
  .setrow .sn { font-family: var(--rounded); font-weight: 700; color: var(--label3); font-size: 17px; }
  .setrow input { font-family: var(--rounded); width: 100%; height: 42px; border: 0; border-radius: 14px; background: var(--fill-faint); text-align: center; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--label3); outline: none; padding: 0 4px; transition: background .2s, color .2s; }
  .setrow input:focus { box-shadow: 0 0 0 2px var(--tint) inset; color: var(--label); }
  .setrow input.bad { box-shadow: 0 0 0 2px var(--red) inset; }
  .setrow.done .sn { color: var(--label); }
  .setrow.done input { color: var(--label); background: var(--fill); }
  .check { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
  .check .ring { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--label3); display: flex; align-items: center; justify-content: center; transition: transform .45s var(--bounce), background .2s, border-color .2s; }
  .setrow.just .check .ring { animation: tickPop .55s var(--bounce); }
  .setrow.just .check .ring svg path { stroke-dasharray: 26; animation: tickDraw .32s .1s ease-out both; }
  @keyframes tickPop { 0% { transform: scale(.55); } 60% { transform: scale(1.18); } 100% { transform: scale(1.05); } }
  @keyframes tickDraw { from { stroke-dashoffset: 26; } to { stroke-dashoffset: 0; } }
  .setrow input { transition: background .35s ease-out, color .35s ease-out; }
  .setrow.done .check .ring { background: var(--green); border-color: var(--green); color: #fff; transform: scale(1.05); }
  .check:active .ring { transform: scale(.82); transition: transform .1s ease-out; }

  .stepper { display: flex; align-items: center; margin: 16px auto 0; border-radius: 22px; width: max-content; height: 44px; }
  .stepper button { width: 52px; height: 44px; font-size: 22px; color: var(--label); display: flex; align-items: center; justify-content: center; }
  .stepper button, .mini-stepper button { transition: transform .45s var(--bounce), opacity .3s; }
  .stepper button:active:not(:disabled), .mini-stepper button:active:not(:disabled) { transform: scale(.8); opacity: .55; transition: transform .1s ease-out, opacity .1s; }
  .stepper button:disabled { color: var(--label3); }
  .stepper span { min-width: 70px; text-align: center; font-size: 15px; font-weight: 500; color: var(--label2); }

  /* Segmented control */
  .seg { display: flex; background: var(--fill); border-radius: 22px; padding: 3px; margin-bottom: 14px; position: relative; }
  .seg button { flex: 1; height: 36px; border-radius: 18px; font-size: 14px; font-weight: 500; color: var(--label); transition: background .2s, transform .4s var(--bounce); position: relative; z-index: 1; }
  .seg button:active { transform: scale(.95); transition: transform .1s ease-out; }
  .seg.has-thumb button.on { background: transparent; box-shadow: none; }
  .seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 18px; background: var(--seg-on); box-shadow: 0 3px 10px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); z-index: 0;
    transition: transform .5s var(--bounce-soft), width .5s var(--bounce-soft); }
  .seg.sm .seg-thumb { border-radius: 16px; }
  .seg button.on { background: var(--seg-on); font-weight: 600; box-shadow: 0 3px 10px rgba(0,0,0,.12); }

  /* Calendar */
  .cal-card { background: var(--card); border-radius: var(--r); padding: 10px 8px 12px; }
  .cal-head, .cal { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .cal-head div { font-size: 12px; color: var(--label2); padding: 8px 0; font-weight: 600; }
  .cal button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px 0 5px; }
  .cal .num { font-family: var(--rounded); width: 40px; height: 40px; line-height: 40px; border-radius: 50%; font-size: 19px; font-weight: 500; }
  .cal .out .num { color: var(--label3); }
  .cal .today .num { color: var(--red); font-weight: 700; }
  .cal .sel .num { background: var(--label); color: var(--bg); font-weight: 700; }
  .cal .sel.today .num { background: var(--red); color: #fff; }

  /* Progress card */
  .card { background: var(--card); border-radius: var(--r); padding: 18px 18px 14px; }
  .headline { font-family: var(--rounded); font-size: 40px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 2px 0; }
  .headline small { font-size: 20px; font-weight: 600; color: var(--label2); margin-left: 3px; }
  .hsub { font-size: 15px; color: var(--label2); }
  .hsub.up { color: var(--green); font-weight: 500; }
  .chart { position: relative; height: 210px; margin: 12px 0 0; }
  .chart svg { display: block; touch-action: pan-y; }
  .tip { position: absolute; top: 0; transform: translateX(-50%); color: var(--label); font-size: 13px; padding: 6px 12px; border-radius: 14px; white-space: nowrap; pointer-events: none; }
  .tip b { font-weight: 700; }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  a { color: var(--tint); text-decoration: none; }
  a.cell:not(.action) { color: var(--label); }

  /* History day cards */
  .hcard { background: var(--card); border-radius: var(--r); overflow: hidden; margin-bottom: 14px; padding-bottom: 6px; }
  .hcard-head { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 18px 8px; }
  .hcard-head b { font-size: 17px; font-weight: 700; }
  .hcard-head span { font-size: 14px; color: var(--label2); font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: 12px; font-weight: 500; }
  .hset { display: flex; align-items: center; padding: 8px 18px; font-variant-numeric: tabular-nums; }
  .hset .n { font-family: var(--rounded); width: 30px; height: 26px; border-radius: 13px; background: var(--fill); color: var(--label2); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-right: 14px; }
  .hset .v { font-weight: 500; }

  #status { color: var(--red); font-size: 15px; padding-top: 6px; }

  /* Sheets (floating) */
  #sheet[hidden] { display: none; }
  .backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 20; animation: fade .35s ease; }
  .sheet {
    position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 21; max-width: 584px; margin: 0 auto;
    max-height: calc(100% - 56px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch;
    border-radius: 34px; padding: 0 14px 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    animation: up .5s var(--spring);
  }
  .sheet-ghost { position: fixed; inset: 0; z-index: 22; pointer-events: none; }
  .sheet-ghost .sheet { animation: sheetOut .34s var(--spring) forwards; }
  .sheet-ghost .backdrop { animation: fadeOut .3s ease forwards; }
  @keyframes sheetOut { to { transform: translateY(115%); } }
  @keyframes fadeOut { to { opacity: 0; } }
  .sheet { background: var(--sheet-bg); } .sheet .group { background: var(--sheet-card); }
  @keyframes up { from { transform: translateY(110%); } }
  @keyframes fade { from { opacity: 0; } }
  .sheet-head { position: sticky; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 68px; z-index: 1; background: inherit; }
  .sheet-head > :first-child { justify-self: start; }
  .sheet-head > :last-child { justify-self: end; }
  .sheet-head b { font-size: 17px; font-weight: 600; }
  .field-input { width: 100%; border: 0; outline: none; background: none; font-size: 17px; padding: 15px 18px; display: block; }
  textarea.field-input { resize: vertical; min-height: 104px; line-height: 1.4; }
  .field-input::placeholder { color: var(--label3); }

  /* Scroll wheels */
  .wheels { display: flex; align-items: center; gap: 6px; padding: 8px 12px; }
  .wheels .x { color: var(--label2); font-size: 17px; }
  .wheel { position: relative; height: 180px; flex: 1; }
  .wheel-scroll {
    height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
            mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
  }
  .wheel-scroll::-webkit-scrollbar { display: none; }
  .wheel.single { height: 48px; }
  .wheel.single .wheel-scroll { -webkit-mask-image: none; mask-image: none; }
  .wheel.single .wheel-pad { height: 4px; }
  .wheel.single .wheel-band { top: 4px; }
  .wheel-pad { height: 70px; }
  .wheel-opt { height: 40px; line-height: 40px; text-align: center; scroll-snap-align: center; font-size: 21px; color: var(--label2); will-change: transform, opacity; transform-origin: 50% 50%; }
  .wheel-opt.on { color: var(--label); font-weight: 500; }
  .wheel-band { position: absolute; left: 0; right: 0; top: 70px; height: 40px; background: var(--fill); border-radius: 12px; pointer-events: none; }

  /* Reorder + trash */
  .drag-row { display: flex; align-items: center; background: var(--card); transition: transform .2s cubic-bezier(.2,.8,.3,1); }
  .drag-row .cell { flex: 1; min-width: 0; }
  .drag-row.dragging { transition: none; z-index: 2; box-shadow: 0 10px 30px rgba(0,0,0,.18); border-radius: 14px; }
  .sorting { user-select: none; -webkit-user-select: none; }
  .grip { width: 44px; height: 52px; display: flex; align-items: center; justify-content: center; color: var(--label3); touch-action: none; flex: none; cursor: grab; }
  .trash { min-width: 44px; height: 36px; margin-right: 10px; padding: 0 8px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: var(--red); flex: none; font-size: 15px; font-weight: 600; transition: all .2s; }
  .trash:active { background: var(--red-soft); }
  .trash.confirm { background: var(--red); color: #fff; padding: 0 14px; }

  /* Exercise pager */
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--label2); margin: 2px 2px 2px; }
  .eyebrow + .large-title { margin-top: 0; }
  .slide-wrap.from-right { animation: fromRight .36s var(--spring); }
  .slide-wrap.from-left { animation: fromLeft .36s var(--spring); }
  @keyframes fromRight { from { transform: translateX(14px); opacity: .35; } }
  @keyframes fromLeft { from { transform: translateX(-14px); opacity: .35; } }

  /* Screen transitions: deeper screens slide up from the bottom, going back slides them down */
  #app { position: relative; z-index: 2; background: var(--bg); min-height: 100vh; }
  .ghost { position: fixed; left: 0; right: 0; margin: 0 auto; max-width: 600px; padding: 0 16px; z-index: 1; pointer-events: none; background: var(--bg); }
  .ghost.top { z-index: 3; box-shadow: 0 -10px 40px rgba(0,0,0,.15); border-radius: 28px 28px 0 0; }
  .enter-up { animation: enterUp .5s var(--spring); box-shadow: 0 -10px 40px rgba(0,0,0,.15); border-radius: 28px 28px 0 0; }
  .recede { animation: recede .5s var(--spring) forwards; }
  .leave-down { animation: leaveDown .42s var(--spring) forwards; }
  .under { animation: under .42s var(--spring); }
  @keyframes enterUp { from { transform: translateY(100vh); } }
  @keyframes recede { to { transform: scale(.94); opacity: .5; } }
  @keyframes leaveDown { to { transform: translateY(100vh); } }
  @keyframes under { from { transform: scale(.94); opacity: .5; } }

  /* Swiping */
  #app { overflow-x: clip; }
  .swipe-area { min-height: calc(100vh - 56px - env(safe-area-inset-top)); }
  .swipe-area.day-swipe { min-height: calc(100vh - 190px - env(safe-area-inset-top)); touch-action: pan-y; }
  .pager, .week-track { position: relative; will-change: transform; }
  .peek { position: absolute; width: 100%; pointer-events: none; }
  .slide-wrap, .peek { display: flow-root; }
  .week-wrap { margin: 6px 0 22px; touch-action: pan-y; }
  .week-wrap .week { margin: 0; }
  body:has(.pdots) #app { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }

  /* Page dots */
  .pdots { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 2px; padding: 0 8px; height: 28px; border-radius: 14px; z-index: 9; }
  .pdot { width: 16px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .pdot::after { content: ""; width: 7px; height: 7px; border-radius: 4px; background: var(--label3); transition: width .25s, background .25s; }
  .pdot.on::after { width: 18px; background: var(--label); }
  .pdot.on { width: 26px; }

  /* End-of-workout page */
  .finish { display: flex; flex-direction: column; align-items: stretch; padding-top: 8vh; }
  .finish-sub { text-align: center; color: var(--label2); font-size: 15px; margin-bottom: 14px; }
  .wheels.dur { justify-content: center; }
  .wheels.dur .wheel { flex: 0 0 72px; }
  .wheels.dur .unit { font-size: 17px; font-weight: 600; color: var(--label2); width: 40px; }

  /* Session timer */
  .timer { height: 40px; padding: 0 14px; font-size: 15px; font-weight: 600; font-family: var(--rounded); font-variant-numeric: tabular-nums; gap: 6px; }
  .timer.running { color: var(--label); }
  .timer .rec { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .timer.ended { color: var(--green); }

  /* Settings */
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 8px 12px 8px 18px; position: relative; }
  .set-row + .set-row::before, .cell + .set-row::before, .set-row + .cell::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; border-top: .5px solid var(--sep); }
  .set-row .lbl { font-weight: 500; }
  .seg.sm { margin: 0; flex: none; }
  .seg.sm button { flex: none; height: 32px; padding: 0 12px; font-size: 13px; }
  .mini-stepper { display: flex; align-items: center; background: var(--fill); border-radius: 18px; height: 34px; }
  .mini-stepper button { width: 38px; height: 34px; font-size: 19px; display: flex; align-items: center; justify-content: center; }
  .mini-stepper button:disabled { color: var(--label3); }
  .mini-stepper span { min-width: 26px; text-align: center; font-family: var(--rounded); font-weight: 700; font-variant-numeric: tabular-nums; }
  .profile { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #5ac8fa, #007aff); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex: none; font-family: var(--rounded); }
  .profile input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 20px; font-weight: 600; padding: 6px 0; }
  .profile input::placeholder { color: var(--label3); }
  .badge { font-size: 12px; font-weight: 600; color: var(--label2); background: var(--fill); border-radius: 10px; padding: 3px 8px; }
  .badge.ok { color: var(--green); background: var(--green-soft); }
  .primary.destructive-fill { background: var(--red); }
  .set-row .sub { font-size: 13px; color: var(--label2); margin-top: 1px; }
  .pick-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--label3); display: flex; align-items: center; justify-content: center; color: #fff; flex: none; box-sizing: border-box; transition: transform .4s var(--bounce), background .2s, border-color .2s; }
  .pick-row.on .pick-dot { background: var(--tint); border-color: var(--tint); transform: scale(1.05); }
  .pick-row:active .pick-dot { transform: scale(.85); transition: transform .1s ease-out; }
  .gift-head { text-align: center; margin: 2px 0 6px; }
  .gift-ic { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 10px; background: var(--tint-soft); color: var(--tint); display: flex; align-items: center; justify-content: center; }
  .gift-ic svg { width: 26px; height: 26px; }
  .inbox-ic { width: 36px; height: 36px; border-radius: 50%; background: var(--tint-soft); color: var(--tint); display: flex; align-items: center; justify-content: center; flex: none; }
  .hero { text-align: center; padding: 28px 22px 24px; }
  .hero-icon { width: 76px; height: 76px; border-radius: 24px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(135deg, #34c759, #30b0c7); }
  .hero h2 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.02em; }
  .hero p { color: var(--label2); margin: 0; line-height: 1.4; font-size: 15px; }

  /* Sign-in */
  .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 52px; border-radius: 26px; background: var(--sheet-card); font-weight: 600; box-shadow: inset 0 0 0 .5px var(--sep); }
  .google-btn:active { transform: scale(.97); }
  .google-btn:disabled, .primary:disabled { opacity: .5; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--label2); font-size: 13px; margin: 16px 6px; }
  .or::before, .or::after { content: ""; flex: 1; border-top: .5px solid var(--sep); }
  .auth-links { display: flex; justify-content: space-between; margin: 10px 2px 0; font-size: 15px; }
  .tint { color: var(--tint); padding: 8px 4px; font-weight: 500; }
  .tint:active { opacity: .5; }

  /* Plans */
  .dot.plan { background: transparent; box-shadow: inset 0 0 0 1.5px var(--label3); }
  .day.sel .dot.plan { box-shadow: inset 0 0 0 1.5px var(--bg); }
  .pill-active { font-size: 12px; font-weight: 600; color: var(--green); background: var(--green-soft); border-radius: 10px; padding: 3px 8px; }
  .daynum { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 13px; background: var(--fill); color: var(--label2); font-family: var(--rounded); font-size: 13px; font-weight: 700; margin-right: 12px; vertical-align: middle; }
  .daynum.now { background: var(--tint); color: #fff; }
  .set-row .main { display: flex; align-items: center; font-weight: 500; }
  .move-btn { height: 36px; font-size: 14px; margin: -4px 0 14px; padding: 0 14px; color: var(--tint); }
  .date-input { border: 0; background: var(--fill); border-radius: 10px; padding: 7px 10px; font-size: 16px; color: var(--label); font-family: inherit; }
  .primary:disabled { opacity: .45; }

  /* Friends */
  .code-card { padding: 16px 18px; text-align: center; }
  .code { font-family: var(--rounded); font-size: 34px; font-weight: 700; letter-spacing: .08em; margin: 4px 0 12px; font-variant-numeric: tabular-nums; }
  .code-btns { display: flex; gap: 10px; justify-content: center; }
  .code-btns .capsule { height: 40px; font-size: 15px; color: var(--tint); }
  .code-btns .capsule:disabled { opacity: .4; }
  .code-input { font-family: var(--rounded); font-size: 26px; font-weight: 700; letter-spacing: .1em; text-align: center; text-transform: uppercase; }
  .avatar.sm { width: 36px; height: 36px; font-size: 15px; margin-right: 12px; }
  .cell .avatar.sm { margin-right: 0; }
  .tint-fill { height: 34px; padding: 0 14px; font-size: 15px; background: var(--tint); color: #fff; }
  .friend-head { display: flex; align-items: center; gap: 14px; margin: 4px 0 16px; }
  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stat-row.three .stat { padding: 12px 14px; }
  .stat-row.three .stat-l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-row.three .stat-n { font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 10px; padding: 2px 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0 0 4px; padding: 2px 4px; }
  .chip { flex: none; padding: 7px 14px; border-radius: 18px; background: var(--fill); font-size: 15px; font-weight: 500; color: var(--label); transition: transform .45s var(--bounce), background .2s, color .2s; }
  .chip:active { transform: scale(.92); transition: transform .1s ease-out; }
  .chip.on { background: var(--tint); color: #fff; }
  .add-dot { width: 28px; height: 28px; border-radius: 50%; background: var(--tint-soft); color: var(--tint); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .del-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--red); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; font-size: 18px; font-weight: 700; line-height: 1; }
  .cell.armed .main > div:first-child { color: var(--red); }
  .sec-link { display: flex; justify-content: space-between; align-items: baseline; }
  .sec-link button { font-size: 17px; font-weight: 400; letter-spacing: 0; color: var(--tint); }
  .me-cell .avatar { width: 52px; height: 52px; font-size: 22px; }
  .me-cell .main > div:first-child { font-size: 19px; font-weight: 600; }
  .stat { background: var(--card); border-radius: var(--r); padding: 14px 16px; }
  .stat-n { font-family: var(--rounded); font-size: 30px; font-weight: 700; }
  .stat-l { font-size: 13px; color: var(--label2); }
  .tab-badge { position: absolute; top: 4px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; }
  #dock button { position: relative; }
  .switch { -webkit-appearance: none; appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill2); position: relative; flex: none; transition: background .3s ease; cursor: pointer; margin: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .4s var(--bounce-soft), width .25s ease; }
  .switch:active::after { width: 33px; }
  .switch:checked { background: var(--green); }
  .switch:checked::after { transform: translateX(20px); }
  .switch:checked:active::after { transform: translateX(14px); }

  /* Finish */
  .finish-btn { margin-top: 22px; }
  .primary svg { flex: none; }
  .finish-summary { text-align: center; font-size: 15px; color: var(--label2); margin: 0 6px 12px; }

  /* Floating tab bar */
  #dock {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 10;
    width: min(calc(100% - 28px), 440px); height: 64px; border-radius: 32px; padding: 5px;
    display: flex; align-items: stretch; gap: 2px;
  }
  #dock button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px; font-weight: 600; color: var(--label); border-radius: 27px; transition: background .25s, color .25s; }
  #dock button.on { color: var(--tint); background: var(--fill); }
  #dock button { position: relative; z-index: 1; transition: transform .45s var(--bounce), color .3s; }
  #dock button:active { transform: scale(.9); transition: transform .12s ease-out; }
  /* Tab bar: the selection slides between tabs */
  #dock.has-ind button.on { background: transparent; }
  .dock-ind { position: absolute; top: 5px; bottom: 5px; left: 0; border-radius: 27px; background: var(--fill); z-index: 0; transition: transform .55s cubic-bezier(.3,1.3,.5,1), width .55s cubic-bezier(.3,1.3,.5,1); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  /* Toast (PRs, small confirmations) */
  #toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; top: calc(10px + env(safe-area-inset-top)); transform: translateY(-160%); z-index: 40; display: flex; align-items: center; gap: 10px;
    padding: 10px 18px 10px 12px; border-radius: 24px; font-weight: 600; font-size: 15px; max-width: calc(100% - 32px); transition: transform .45s cubic-bezier(.2,.9,.3,1.15); pointer-events: none; }
  #toast.show { transform: translateY(0); }
  #toast .tic { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,159,10,.18); color: #ff9f0a; display: flex; align-items: center; justify-content: center; flex: none; }
  #toast small { display: block; font-size: 13px; font-weight: 500; color: var(--label2); }
  .pr-mini { display: block; font-size: 9px; font-weight: 800; letter-spacing: .04em; color: #ff9f0a; line-height: 1; margin-top: 2px; }
  .pr-badge { font-size: 11px; font-weight: 800; letter-spacing: .04em; color: #ff9f0a; background: rgba(255,159,10,.15); border-radius: 8px; padding: 2px 6px; margin-left: 8px; }

  /* Rest stopwatch pill, floats above the tab bar */
  #rest { position: fixed; left: 50%; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 11;
    width: min(calc(100% - 28px), 440px); transition: transform .35s cubic-bezier(.2,.9,.3,1.1), opacity .25s; }
  #rest.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  body:has(.pdots) #rest { bottom: calc(122px + env(safe-area-inset-bottom)); }
  body:has(#rest.on) #app { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }
  .rest-in { position: relative; overflow: hidden; display: flex; align-items: center; height: 54px; border-radius: 27px; padding: 0 6px 0 20px; }
  .rest-in .rest-ex { font-size: 13px; color: var(--label2); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  .rest-in button { position: relative; height: 42px; min-width: 52px; border-radius: 21px; font-weight: 600; font-size: 15px; color: var(--tint); font-family: var(--rounded); }
  .rest-in button:active { background: var(--fill); }
  .rest-mid { position: relative; flex: 1; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .rest-mid .lbl { font-size: 13px; color: var(--label2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .rest-mid .t { font-family: var(--rounded); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rest-in #rSkip { min-width: 42px; color: var(--label2); }

  /* Move back a day sheet */
  .mv-opt:active { transform: scale(.98); }
  .mv-opt { transition: transform .45s var(--bounce), box-shadow .2s !important; }
  .mv-opt { display: flex; gap: 12px; width: 100%; text-align: left; background: var(--card); border-radius: 18px; padding: 14px 14px 12px; margin-bottom: 10px; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .15s; }
  .mv-opt.on { box-shadow: inset 0 0 0 2px var(--tint); }
  .mv-radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--label3); flex: none; margin-top: 1px; box-sizing: border-box; }
  .mv-opt.on .mv-radio { border: 7px solid var(--tint); }
  .mv-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .mv-body b { font-size: 16px; }
  .mv-d { font-size: 14px; color: var(--label2); line-height: 1.3; }
  .pv-row { display: flex; gap: 4px; margin-top: 8px; }
  .pv { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 2px; border-radius: 9px; background: var(--fill); font-size: 11px; font-weight: 600; color: var(--label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv b { font-size: 10px; font-weight: 600; color: var(--label2); text-transform: uppercase; }
  .pv.rest { color: var(--label2); font-weight: 500; }
  .pv.chg { background: var(--tint-soft); color: var(--tint); }
  .pv.chg b { color: var(--tint); }

  /* Workout summary */
  .sum-hero { text-align: center; margin: 4px 0 18px; }
  .sum-check { width: 72px; height: 72px; border-radius: 50%; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; animation: pop .5s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .sum-hero .large-title { margin: 0; text-align: center; }
  .sum-hero .day-sub { text-align: center; }
  .stat-row.two-by-two .stat-n { font-size: 26px; }
  .delta { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta.up { color: var(--green); } .delta.down { color: var(--red); } .delta.same { color: var(--label2); font-weight: 500; }
  .cell .lead-ic { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,159,10,.15); color: #ff9f0a; display: flex; align-items: center; justify-content: center; flex: none; }

  /* ================= Polish layer ================= */
  :root { --card-shadow: 0 1px 2px rgba(0,0,0,.03), 0 6px 20px -10px rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { :root[data-theme="system"] { --card-shadow: none; } }
  :root[data-theme="dark"] { --card-shadow: none; }
  ::selection { background: var(--tint-soft); }
  input, textarea { caret-color: var(--tint); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  .large-title { letter-spacing: -.026em; text-wrap: balance; }
  .section, .day-title { text-wrap: balance; }
  .footnote, .hero p, .finish-sub, .mv-d { text-wrap: pretty; }
  .cell .sub, .day-sub, .stat-n, .headline, .hsub { font-variant-numeric: tabular-nums; }
  .cell .chev { opacity: .75; }

  /* Depth: cards sit a hair above the page in light mode */
  .group, .card, .hcard, .stat, .cal-card, .lastbox { box-shadow: var(--card-shadow); }
  .sheet .group, .sheet .stat { box-shadow: none; }

  /* Top bar: sticks, turns to glass once content scrolls under it, and shows the title in small type */
  header.nav, header.weekhead { position: sticky; top: env(safe-area-inset-top); z-index: 6; }
  header.nav::before, header.weekhead::before { content: ""; position: absolute; z-index: -1; left: -16px; right: -16px; top: calc(-1 * env(safe-area-inset-top)); bottom: -4px;
    background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
    border-bottom: .5px solid var(--sep); opacity: 0; transition: opacity .22s ease; pointer-events: none; }
  header.scrolled::before { opacity: 1; }
  .nav-title { position: absolute; left: 50%; top: 50%; max-width: 52%; transform: translate(-50%, calc(-50% + 8px)); opacity: 0; font-weight: 600; font-size: 17px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; transition: opacity .2s ease, transform .35s var(--spring); }
  header.titled .nav-title { opacity: 1; transform: translate(-50%, -50%); }
  .ghost header.nav, .ghost header.weekhead { position: relative; top: 0; }

  /* Where content meets the tab bar it fades out instead of colliding with it */
  #dockfade { position: fixed; left: 0; right: 0; bottom: 0; height: calc(104px + env(safe-area-inset-bottom)); z-index: 9; pointer-events: none;
    background: linear-gradient(to top, var(--bg) 0%, var(--bg) 22%, transparent 100%); }
  .pdots { z-index: 10; }

  /* Tabs: the new tab settles in, its icon gives a small pop */
  #app.tab-in { animation: tabIn .32s var(--spring); }
  @keyframes tabIn { from { opacity: 0; transform: translateY(10px) scale(.992); } }
  #dock button.pop svg { animation: iconPop .5s var(--bounce); }
  @keyframes iconPop { 0% { transform: scale(.78); } 55% { transform: scale(1.14); } 100% { transform: scale(1); } }
  #dock button svg { transition: transform .3s var(--bounce); }

  /* Week strip: the selection is a capsule that slides between days */
  .week { position: relative; }
  .week.has-ind .day.sel, .week.has-ind .day.sel.today { background: transparent; }
  .week-ind { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 22px; background: var(--label); z-index: 0;
    transition: transform .42s var(--spring), width .42s var(--spring), background .25s ease; box-shadow: 0 6px 14px -8px rgba(0,0,0,.35); will-change: transform; }
  .week-ind.today { background: var(--red); box-shadow: 0 8px 16px -8px var(--red); }
  .week .day { position: relative; z-index: 1; }
  /* Text recolours in step with the capsule: the day it leaves turns dark right away, the day it lands on turns light as it arrives */
  .week.has-ind .day .wd, .week.has-ind .day .num, .week.has-ind .day .dot { transition: color .16s ease, background .16s ease, box-shadow .16s ease; }
  .week.has-ind .day.sel .wd, .week.has-ind .day.sel .num, .week.has-ind .day.sel .dot { transition: color .2s ease .14s, background .2s ease .14s, box-shadow .2s ease .14s; }
  .week.has-ind .day:active { background: transparent; }
  .week.has-ind .day { transition: none; }
  /* While the capsule travels: the day it lands on starts dark, the day it left starts light, then both fade to their colours */
  .week.has-ind .day.arriving .wd, .week.has-ind .day.arriving .num, .week.has-ind .day.arriving .dot { transition: none !important; }
  .week.has-ind .day.arriving .wd { color: var(--label2); } .week.has-ind .day.arriving.today .wd, .week.has-ind .day.arriving.today .num { color: var(--red); }
  .week.has-ind .day.arriving:not(.today) .num { color: var(--label); }
  .week.has-ind .day.leaving .wd, .week.has-ind .day.leaving .num { transition: none !important; color: var(--bg); }
  .week.has-ind .day.leaving.today .wd, .week.has-ind .day.leaving.today .num { color: #fff; }
  .week.has-ind .day:active .num { transform: scale(.9); }
  .week.has-ind .day .num { transition: color .16s ease, transform .35s var(--bounce); display: inline-block; }
  .week.has-ind .day.sel .num { transition: color .2s ease .14s, transform .35s var(--bounce); }

  /* Day: progress while a workout is on, rings per exercise, a proper empty state */
  .dprog { height: 5px; border-radius: 3px; background: var(--fill); margin: -4px 2px 16px; overflow: hidden; }
  .dprog i { display: block; height: 100%; border-radius: 3px; background: var(--tint); transition: width .6s var(--spring), background .3s; }
  .dprog.full i { background: var(--green); }
  .pring { width: 28px; height: 28px; flex: none; display: inline-flex; }
  .pring .trk { fill: none; stroke: var(--fill2); stroke-width: 3; }
  .pring .arc { fill: none; stroke: var(--tint); stroke-width: 3; stroke-linecap: round; }
  .pring.full .trk { fill: var(--green); stroke: var(--green); }
  .pring .chk { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .day-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 34px 20px 26px; color: var(--label2); font-size: 15px; }
  .day-empty b { color: var(--label); font-size: 19px; font-weight: 700; letter-spacing: -.02em; margin-top: 10px; }
  .de-ic { width: 64px; height: 64px; border-radius: 50%; background: var(--fill); color: var(--label2); display: flex; align-items: center; justify-content: center; }

  /* Buttons: the main action has a little light and shadow of its own */
  .primary { background: linear-gradient(180deg, color-mix(in srgb, var(--tint) 90%, #fff) 0%, var(--tint) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 10px 22px -12px var(--tint); transition: transform .5s var(--bounce), box-shadow .3s, opacity .2s; }
  .primary:active { box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 4px 10px -8px var(--tint); }
  .primary:disabled { box-shadow: none; }
  .primary.destructive-fill { background: linear-gradient(180deg, color-mix(in srgb, var(--red) 90%, #fff) 0%, var(--red) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 10px 22px -12px var(--red); }
  .search { transition: background .2s ease, box-shadow .2s ease; }
  .search:focus-within { background: var(--card); box-shadow: 0 0 0 2px var(--tint) inset; }
  .field-input { transition: background .2s; }

  /* Sheets get a grabber, like every sheet on iPhone */
  .sheet::before { content: ""; display: block; position: sticky; top: 7px; z-index: 2; width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 7px auto -12px; }

  /* Chart: the line draws itself, the area and points follow */
  .chart svg.draw .c-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: lineDraw .9s .05s cubic-bezier(.4,0,.2,1) forwards; }
  .chart svg.draw .c-area { opacity: 0; animation: fadeIn .6s .45s ease forwards; }
  .chart svg.draw .c-dots { opacity: 0; animation: fadeIn .35s .7s ease forwards; }
  .chart svg.draw .c-end { opacity: 0; transform-box: fill-box; animation: fadeIn .3s .85s ease forwards; }
  .chart .halo { transform-box: fill-box; transform-origin: center; animation: halo 2.4s 1.2s ease-out infinite; }
  @keyframes lineDraw { to { stroke-dashoffset: 0; } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes halo { 0% { transform: scale(.6); opacity: .35; } 70%, 100% { transform: scale(1.9); opacity: 0; } }

  /* Loading placeholders */
  .skel { border-radius: var(--r); background: linear-gradient(100deg, var(--fill) 30%, var(--fill-faint) 50%, var(--fill) 70%); background-size: 220% 100%; animation: shimmer 1.3s linear infinite; }
  .sk-stat { height: 72px; } .sk-title { height: 24px; width: 46%; border-radius: 8px; margin: 30px 2px 12px; } .sk-card { height: 190px; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -100% 0; } }
</style>
