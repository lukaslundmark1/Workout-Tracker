<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<style>
  :root {
    --bg: #f2f2f7; --card: #fff; --label: #000; --label2: #8a8a8e; --label3: #c4c4c7;
    --sep: rgba(60,60,67,.18); --fill: rgba(118,118,128,.12); --tint: #007aff; --red: #ff3b30; --green: #34c759;
    --r: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--label); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 17px; letter-spacing: -.01em;
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
  }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; }
  input, textarea { font: inherit; letter-spacing: inherit; color: var(--label); }
  #app { max-width: 600px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }

  /* Navigation bar */
  .nav { display: flex; align-items: center; gap: 2px; height: 44px; margin: 0 -8px; }
  .nav .title { font-weight: 600; font-size: 17px; }
  .spacer { flex: 1; }
  .icon-btn { min-width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--tint); }
  .icon-btn:active, .tint:active { opacity: .4; }
  .tint { color: var(--tint); padding: 8px; }
  .back { display: inline-flex; align-items: center; gap: 2px; color: var(--tint); padding: 8px 8px 8px 2px; }
  .back svg { margin-top: 1px; }
  .pill-btn { font-size: 15px; padding: 5px 12px; border-radius: 99px; background: var(--fill); color: var(--tint); font-weight: 500; }
  .large-title { font-size: 34px; font-weight: 700; letter-spacing: .01em; margin: 4px 0 12px; line-height: 1.15; }
  .title2 { font-size: 22px; font-weight: 700; margin: 4px 0 10px; }
  .section { font-size: 13px; color: var(--label2); text-transform: uppercase; margin: 22px 16px 7px; letter-spacing: 0; }
  .footnote { font-size: 13px; color: var(--label2); margin: 7px 16px 0; line-height: 1.35; }

  /* Grouped inset lists */
  .group { background: var(--card); border-radius: var(--r); overflow: hidden; }
  .group + .group { margin-top: 12px; }
  .cell { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 11px 16px; text-align: left; position: relative; }
  .cell:active:not(:disabled) { background: #e5e5ea; }
  .cell + .cell::before, .cell-wrap + .cell-wrap::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
  .cell-wrap { position: relative; }
  .cell .main { flex: 1; min-width: 0; }
  .cell .sub { font-size: 15px; color: var(--label2); margin-top: 1px; }
  .cell .detail { color: var(--label2); }
  .chev { color: var(--label3); flex: none; }
  .cell.action { color: var(--tint); }
  .cell.destructive { color: var(--red); justify-content: center; }
  .cell.destructive.confirm { font-weight: 600; }
  .cell:disabled { color: var(--label3); }
  .empty { color: var(--label2); padding: 14px 16px; }
  .err { color: var(--red); font-size: 13px; margin: 8px 16px 0; min-height: 0; }
  .err:empty { display: none; }

  /* Search field */
  .search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; padding: 0 8px; height: 36px; margin-bottom: 12px; color: var(--label2); }
  .search input { flex: 1; border: 0; background: none; outline: none; font-size: 17px; height: 100%; padding: 0; }
  .search input::placeholder { color: var(--label2); }

  /* Week strip */
  .weekhead { display: flex; align-items: center; height: 44px; margin: 0 -8px 0 0; }
  .weekhead .title { font-size: 22px; font-weight: 700; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); margin: 2px -4px 18px; touch-action: pan-y; }
  .day { display: flex; flex-direction: column; align-items: center; padding: 2px 0; }
  .day .wd { font-size: 11px; color: var(--label2); font-weight: 500; }
  .day .num { font-size: 19px; width: 36px; height: 36px; line-height: 36px; text-align: center; border-radius: 50%; margin-top: 3px; }
  .day.today .num { color: var(--red); font-weight: 600; }
  .day.sel .num { background: var(--label); color: #fff; font-weight: 600; }
  .day.sel.today .num { background: var(--red); color: #fff; }
  .dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 4px; }
  .dot.on { background: var(--label2); }
  .day-title { font-size: 22px; font-weight: 700; margin: 0 0 2px; }
  .day-sub { color: var(--label2); font-size: 15px; margin-bottom: 10px; }

  /* Last-time card */
  .lastbar { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border-radius: var(--r); padding: 11px 12px 11px 16px; margin-bottom: 12px; }
  .lastbar:active { background: #e5e5ea; }
  .lastbar .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .lb-label { font-size: 13px; color: var(--label2); }
  .lb-sets { font-size: 17px; font-weight: 500; }
  .lb-more { font-size: 15px; color: var(--label2); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

  details.instr { background: var(--card); border-radius: var(--r); margin-bottom: 12px; padding: 0 16px; }
  details.instr summary { padding: 12px 0; color: var(--tint); cursor: pointer; list-style: none; }
  details.instr summary::-webkit-details-marker { display: none; }
  details.instr[open] summary { border-bottom: .5px solid var(--sep); }
  .instr-text { white-space: pre-wrap; padding: 12px 0; line-height: 1.4; }
  details.instr a { display: inline-block; padding: 0 0 12px; }

  /* Set rows */
  .sets-head, .setrow { display: grid; grid-template-columns: 34px 1fr 1fr 44px; gap: 10px; align-items: center; padding: 0 12px 0 16px; }
  .sets-head { font-size: 13px; color: var(--label2); height: 34px; text-transform: uppercase; }
  .sets-head span:nth-child(2), .sets-head span:nth-child(3) { text-align: center; }
  .setrow { min-height: 54px; position: relative; transition: background .15s; }
  .setrow::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
  .setrow .sn { font-weight: 600; color: var(--label2); font-variant-numeric: tabular-nums; }
  .setrow input { width: 100%; height: 36px; border: 0; border-radius: 8px; background: var(--fill); text-align: center; font-size: 17px; font-variant-numeric: tabular-nums; color: var(--label2); outline: none; padding: 0 4px; }
  .setrow input:focus { box-shadow: 0 0 0 2px var(--tint) inset; color: var(--label); }
  .setrow input.bad { box-shadow: 0 0 0 2px var(--red) inset; }
  .setrow.done { background: rgba(52,199,89,.08); }
  .setrow.done .sn { color: var(--label); }
  .setrow.done input { color: var(--label); background: transparent; font-weight: 600; }
  .setrow.done input:focus { background: var(--fill); }
  .check { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  .check .ring { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--label3); display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .setrow.done .check .ring { background: var(--green); border-color: var(--green); color: #fff; }
  .check:active .ring { transform: scale(.9); }

  .stepper { display: flex; align-items: center; justify-content: center; gap: 0; margin: 14px auto 0; background: var(--card); border-radius: 99px; width: max-content; }
  .stepper button { width: 52px; height: 40px; font-size: 22px; color: var(--tint); display: flex; align-items: center; justify-content: center; }
  .stepper button:disabled { color: var(--label3); }
  .stepper span { min-width: 74px; text-align: center; font-size: 15px; color: var(--label2); border-left: .5px solid var(--sep); border-right: .5px solid var(--sep); line-height: 24px; }

  /* Segmented control */
  .seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-bottom: 14px; }
  .seg button { flex: 1; padding: 6px 4px; border-radius: 7px; font-size: 13px; font-weight: 500; }
  .seg button.on { background: #fff; font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); }

  /* Calendar */
  .cal-card { background: var(--card); border-radius: var(--r); padding: 8px 6px 10px; }
  .cal-head, .cal { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .cal-head div { font-size: 13px; color: var(--label2); padding: 6px 0; font-weight: 500; }
  .cal button { display: flex; flex-direction: column; align-items: center; padding: 3px 0 5px; }
  .cal .num { width: 38px; height: 38px; line-height: 38px; border-radius: 50%; font-size: 19px; }
  .cal .out .num { color: var(--label3); }
  .cal .today .num { color: var(--red); font-weight: 600; }
  .cal .sel .num { background: var(--label); color: #fff; font-weight: 600; }
  .cal .sel.today .num { background: var(--red); }

  /* Progress card */
  .card { background: var(--card); border-radius: var(--r); padding: 14px 16px; }
  .headline { font-size: 34px; font-weight: 700; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .headline small { font-size: 17px; font-weight: 600; color: var(--label2); margin-left: 3px; }
  .hsub { font-size: 15px; color: var(--label2); }
  .chart { position: relative; height: 210px; margin: 10px 0 0; }
  .chart svg { display: block; touch-action: pan-y; }
  .tip { position: absolute; top: 0; transform: translateX(-50%); background: rgba(0,0,0,.85); color: #fff; font-size: 13px; padding: 5px 9px; border-radius: 8px; white-space: nowrap; pointer-events: none; }
  .tip b { font-weight: 600; }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  a { color: var(--tint); text-decoration: none; }

  /* History day cards */
  .hcard { background: var(--card); border-radius: var(--r); overflow: hidden; margin-bottom: 12px; }
  .hcard-head { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 6px; }
  .hcard-head b { font-size: 17px; font-weight: 600; }
  .hcard-head span { font-size: 15px; color: var(--label2); font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: 12px; }
  .hset { display: flex; align-items: center; padding: 9px 16px; position: relative; font-variant-numeric: tabular-nums; }
  .hset::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
  .hset .n { width: 64px; color: var(--label2); }

  #status { color: var(--red); font-size: 15px; padding-top: 6px; }

  /* Bottom sheet */
  #sheet[hidden] { display: none; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; animation: fade .25s; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 600px; margin: 0 auto;
    max-height: calc(100% - 44px - env(safe-area-inset-top)); overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--bg); border-radius: 14px 14px 0 0; padding: 0 16px calc(24px + env(safe-area-inset-bottom));
    animation: up .32s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,.3); margin: 6px auto 0; }
  .sheet-head { position: sticky; top: 0; background: var(--bg); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 50px; z-index: 1; margin: 0 -8px; }
  .sheet-head > :first-child { justify-self: start; }
  .sheet-head > :last-child { justify-self: end; }
  .sheet-head b { font-size: 17px; font-weight: 600; }
  .sheet-head .strong { font-weight: 600; }
  .field-input { width: 100%; border: 0; outline: none; background: none; font-size: 17px; padding: 12px 16px; display: block; }
  textarea.field-input { resize: vertical; min-height: 96px; line-height: 1.35; }
  .field-input::placeholder { color: var(--label3); }

  /* Scroll wheels */
  .wheels { display: flex; align-items: center; gap: 6px; padding: 6px 10px; }
  .wheels .x { color: var(--label2); font-size: 17px; }
  .wheel { position: relative; height: 180px; flex: 1; }
  .wheel-scroll {
    height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
            mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
  }
  .wheel-scroll::-webkit-scrollbar { display: none; }
  .wheel-pad { height: 70px; }
  .wheel-opt { height: 40px; line-height: 40px; text-align: center; scroll-snap-align: center; font-size: 21px; color: var(--label2); }
  .wheel-opt.on { color: var(--label); }
  .wheel-band { position: absolute; left: 0; right: 0; top: 70px; height: 40px; background: var(--fill); border-radius: 8px; pointer-events: none; }
  .primary { display: block; width: 100%; background: var(--tint); color: #fff; padding: 14px; border-radius: 12px; font-weight: 600; margin-top: 14px; }
  .primary:active { opacity: .7; }

  /* Tab bar */
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: rgba(249,249,249,.88); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid rgba(0,0,0,.2);
    display: flex; justify-content: space-around; align-items: stretch;
  }
  #dock button { flex: 1; max-width: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; color: #999; letter-spacing: .01em; }
  #dock button.on { color: var(--tint); }
</style>
</head>
<body>
<div id="app"></div>
<nav id="dock" aria-label="Navigation"></nav>
<div id="sheet" hidden></div>

<script>
/* ================= Storage ================= */
const KEY = 'tt.v1';
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!d || !d.exercises) d = { exercises: [], days: {}, sets: [] };
  return migrate(d);
}
function migrate(d) {
  d.workouts = d.workouts || [];
  d.exercises.forEach(e => {
    e.track = e.track || ['weight', 'reps'];
    e.instructions = e.instructions || '';
    e.video = e.video || '';
  });
  for (const k in d.days) {
    const day = d.days[k];
    if (day.exercises && !day.items) { day.items = day.exercises.map(exId => ({ exId, sets: null })); delete day.exercises; }
    day.items = day.items || [];
    day.workouts = day.workouts || [];
  }
  // v3: every set gets a slot (its row number within that day)
  const groups = {};
  d.sets.forEach(s => { if (s.slot === undefined) (groups[s.exId + '|' + s.date] = groups[s.exId + '|' + s.date] || []).push(s); });
  Object.values(groups).forEach(g => {
    const taken = new Set(d.sets.filter(s => s.slot !== undefined && s.exId === g[0].exId && s.date === g[0].date).map(s => s.slot));
    let i = 0;
    g.sort((a, b) => a.ts - b.ts).forEach(s => { while (taken.has(i)) i++; s.slot = i++; });
  });
  d.version = 3;
  return d;
}
let data = load();
let saveError = '';
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); saveError = ''; }
  catch (e) { saveError = "Couldn't save on this device."; }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ================= Dates ================= */
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const startOfWeek = d => addDays(d, -((d.getDay() + 6) % 7)); // Monday
const todayKey = () => dk(new Date());
const WD = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
const fmtLong = k => parse(k).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = k => parse(k).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTiny = k => parse(k).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmtDayYear = k => parse(k).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).replace(',', '');
const monthName = d => d.toLocaleDateString('en-GB', { month: 'long' });

/* ================= Helpers ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtW = w => String(Math.round(w * 100) / 100);
const exById = id => data.exercises.find(e => e.id === id);
const woById = id => data.workouts.find(w => w.id === id);
const dayOf = k => data.days[k] || { items: [], workouts: [] };
const setsFor = (exId, k) => data.sets.filter(s => s.exId === exId && s.date === k).sort((a, b) => a.slot - b.slot || a.ts - b.ts);
const loggedDays = () => new Set(data.sets.map(s => s.date));
const byName = (a, b) => a.name.localeCompare(b.name);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const $ = id => document.getElementById(id);
function ytId(url) {
  const m = String(url).match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}
const parseW = v => { const n = parseFloat(String(v).replace(',', '.')); return n >= 0 ? n : NaN; };
const parseR = v => { const n = parseInt(v, 10); return n > 0 ? n : NaN; };

/* Estimated 1RM — Wathan (1994). Among the most accurate equations for sets of
   roughly 10 reps or fewer (LeSuer et al. 1997 recommended it for squat and bench). */
const e1rm = s => s.reps <= 1 ? s.weight : (100 * s.weight) / (48.8 + 53.8 * Math.exp(-0.075 * s.reps));

const TRACK_A = [{ v: 'weight', label: 'Weight' }];
const TRACK_B = [{ v: 'reps', label: 'Reps' }];

/* ================= Icons (SF Symbols-style) ================= */
const svg = (p, s = 22, sw = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON_BACK = svg('<path d="M15 5l-7 7 7 7"/>', 22, 2.4);
const ICON_CHEV = svg('<path d="M9 6l6 6-6 6"/>', 14, 2.6);
const ICON_CAL = svg('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>');
const ICON_SEARCH = svg('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>', 17, 2.2);
const ICON_CHECK = svg('<path d="M6 12.5l4 4 8-9"/>', 18, 3);
const ICON_TODAY = svg('<rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/>', 26, 1.7);
const ICON_WORKOUTS = svg('<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/>', 26, 1.7);
const ICON_EXERCISES = svg('<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>', 26, 1.9);
const backBtn = label => `<button class="back" id="back">${ICON_BACK}<span>${esc(label)}</span></button>`;

/* ================= State & routing ================= */
const state = {
  tab: 'today',
  views: { today: 'day', workouts: 'wList', exercises: 'eList' },
  selected: todayKey(),
  weekStart: startOfWeek(new Date()),
  logExId: null,
  calMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  pending: null,
  pickerMode: null,
  pickerQuery: '',
  exQuery: '',
  detailExId: null,
  stat: 'e1rm',
  draft: null,        // workout being edited
  sheet: null,        // open bottom sheet
  drafts: {},         // unsaved values typed into set rows: { 'exId|date': { slot: {w, r} } }
};
const app = $('app');
const TAB_ROOT = { today: 'day', workouts: 'wList', exercises: 'eList' };

function render() {
  const VIEWS = { day: renderDay, log: renderLog, history: renderHistory, picker: renderPicker, calendar: renderCalendar,
                  wList: renderWorkoutList, wEdit: renderWorkoutEdit, eList: renderExerciseList, eDetail: renderExerciseDetail };
  VIEWS[state.views[state.tab]]();
  if (saveError) app.insertAdjacentHTML('afterbegin', `<div id="status">${saveError}</div>`);
  renderDock();
  renderSheet();
}
function go(view, extra = {}) {
  Object.assign(state, extra);
  state.views[state.tab] = view;
  state.pending = null;
  render();
  window.scrollTo(0, 0);
}

/* ================= Tab bar ================= */
function renderDock() {
  const tabs = [['today', 'Today', ICON_TODAY], ['workouts', 'Workouts', ICON_WORKOUTS], ['exercises', 'Exercises', ICON_EXERCISES]];
  const dock = $('dock');
  dock.innerHTML = tabs.map(([t, label, icon]) => `<button data-tab="${t}" class="${state.tab === t ? 'on' : ''}">${icon}<span>${label}</span></button>`).join('');
  dock.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    const t = b.dataset.tab;
    if (state.tab === t) { go(TAB_ROOT[t]); return; }
    state.tab = t; state.pending = null; render(); window.scrollTo(0, 0);
  });
}

/* ================= Scroll wheel ================= */
const ITEM = 40;
function wheelHTML(id, options) {
  return `<div class="wheel" id="${id}"><div class="wheel-band"></div><div class="wheel-scroll"><div class="wheel-pad"></div>${options.map((o, i) =>
    `<div class="wheel-opt" data-i="${i}">${esc(o.label)}</div>`).join('')}<div class="wheel-pad"></div></div></div>`;
}
function initWheel(id, index) {
  const sc = $(id).querySelector('.wheel-scroll');
  const opts = [...sc.querySelectorAll('.wheel-opt')];
  const mark = () => { const i = wheelIndex(id); opts.forEach((o, j) => o.classList.toggle('on', i === j)); };
  sc.scrollTop = index * ITEM;
  mark();
  sc.addEventListener('scroll', mark, { passive: true });
  opts.forEach(o => o.onclick = () => sc.scrollTo({ top: Number(o.dataset.i) * ITEM, behavior: 'smooth' }));
}
function wheelIndex(id) {
  const sc = $(id).querySelector('.wheel-scroll');
  const n = sc.querySelectorAll('.wheel-opt').length;
  return Math.max(0, Math.min(n - 1, Math.round(sc.scrollTop / ITEM)));
}

/* ================= Shared list builders ================= */
const cell = ({ attrs = '', main, sub = '', detail = '', chev = true, cls = '' }) =>
  `<button class="cell ${cls}" ${attrs}><span class="main"><div>${main}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</span>${detail ? `<span class="detail">${detail}</span>` : ''}${chev ? `<span class="chev">${ICON_CHEV}</span>` : ''}</button>`;
const searchHTML = (id, ph) => `<label class="search">${ICON_SEARCH}<input id="${id}" placeholder="${ph}" autocomplete="off" type="search"></label>`;

/* ================= TODAY: day view ================= */
function weekLabel(ws) {
  const we = addDays(ws, 6);
  if (ws.getMonth() === we.getMonth()) return `${monthName(ws)} ${ws.getFullYear()}`;
  const y = ws.getFullYear() === we.getFullYear() ? '' : ` ${ws.getFullYear()}`;
  return `${monthName(ws).slice(0, 3)}${y} – ${monthName(we).slice(0, 3)} ${we.getFullYear()}`;
}

function renderDay() {
  const logged = loggedDays();
  const tk = todayKey();
  const showToday = dk(state.weekStart) !== dk(startOfWeek(new Date())) || state.selected !== tk;
  const days = Array.from({ length: 7 }, (_, i) => {
    const k = dk(addDays(state.weekStart, i));
    const cls = ['day', k === tk && 'today', k === state.selected && 'sel'].filter(Boolean).join(' ');
    return `<button class="${cls}" data-k="${k}"><span class="wd">${WD[i]}</span><span class="num">${parse(k).getDate()}</span><span class="dot ${logged.has(k) ? 'on' : ''}"></span></button>`;
  }).join('');

  const day = dayOf(state.selected);
  const rows = day.items.map(it => {
    const ex = exById(it.exId); if (!ex) return '';
    const s = setsFor(it.exId, state.selected);
    const total = Math.max(it.sets || 0, s.length);
    const sub = s.length ? s.map(x => `${fmtW(x.weight)}×${x.reps}`).join(', ') : `${plural(total, 'set')} planned`;
    return cell({ attrs: `data-ex="${it.exId}"`, main: esc(ex.name), sub, detail: s.length ? `${s.length}/${total}` : '' });
  }).join('');

  app.innerHTML = `
    <header class="weekhead">
      <span class="title">${weekLabel(state.weekStart)}</span>
      <button class="icon-btn" id="prevW" aria-label="Previous week">${svg('<path d="M15 5l-7 7 7 7"/>', 20, 2.4)}</button>
      <button class="icon-btn" id="nextW" aria-label="Next week">${svg('<path d="M9 5l7 7-7 7"/>', 20, 2.4)}</button>
      <span class="spacer"></span>
      ${showToday ? '<button class="pill-btn" id="today">Today</button>' : ''}
      <button class="icon-btn" id="calBtn" aria-label="Calendar">${ICON_CAL}</button>
    </header>
    <div class="week" id="week">${days}</div>
    <div class="day-title">${fmtLong(state.selected)}</div>
    <div class="day-sub">${day.workouts.length ? day.workouts.map(w => esc(w.name)).join(' + ') : (day.items.length ? 'Custom workout' : 'Rest day')}</div>
    ${day.items.length ? `<div class="group">${rows}</div>` : ''}
    <div class="group"><button class="cell action" id="addEx">Add exercise / workout</button></div>`;

  const shift = n => { state.weekStart = addDays(state.weekStart, 7 * n); render(); };
  $('prevW').onclick = () => shift(-1);
  $('nextW').onclick = () => shift(1);
  if ($('today')) $('today').onclick = () => { state.selected = tk; state.weekStart = startOfWeek(new Date()); render(); };
  $('calBtn').onclick = () => { const d = parse(state.selected); go('calendar', { calMonth: new Date(d.getFullYear(), d.getMonth(), 1) }); };
  $('addEx').onclick = () => go('picker', { pickerQuery: '', pickerMode: data.workouts.length ? 'workouts' : 'exercises' });
  app.querySelectorAll('.day').forEach(b => b.onclick = () => { state.selected = b.dataset.k; render(); });
  app.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => go('log', { logExId: b.dataset.ex }));

  const wk = $('week');
  let x0 = null;
  wk.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  wk.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) shift(dx < 0 ? 1 : -1);
  });
}

/* ================= TODAY: log sets ================= */
function renderLog() {
  const ex = exById(state.logExId);
  const k = state.selected;
  const item = ex && dayOf(k).items.find(i => i.exId === ex.id);
  if (!ex || !item) return go('day');
  const today = setsFor(ex.id, k);
  const bySlot = {};
  today.forEach(s => { bySlot[s.slot] = s; });
  const maxSlot = today.reduce((m, s) => Math.max(m, s.slot), -1);
  const n = Math.max(item.sets || 0, maxSlot + 1);
  const dkey = ex.id + '|' + k;
  const drafts = (state.drafts[dkey] = state.drafts[dkey] || {});

  const prevDates = [...new Set(data.sets.filter(s => s.exId === ex.id && s.date < k).map(s => s.date))].sort();
  const prevK = prevDates[prevDates.length - 1];
  const prevSets = prevK ? setsFor(ex.id, prevK) : [];

  // Suggested values for a row that isn't done yet:
  // what you typed → the closest finished set above it today → same set last time → last set last time
  const suggest = i => {
    if (drafts[i]) return drafts[i];
    for (let j = i - 1; j >= 0; j--) if (bySlot[j]) return { w: fmtW(bySlot[j].weight), r: String(bySlot[j].reps) };
    const p = prevSets[i] || prevSets[prevSets.length - 1];
    return p ? { w: fmtW(p.weight), r: String(p.reps) } : { w: '', r: '' };
  };

  let rows = '';
  for (let i = 0; i < n; i++) {
    const s = bySlot[i];
    const v = s ? { w: fmtW(s.weight), r: String(s.reps) } : suggest(i);
    rows += `<div class="setrow ${s ? 'done' : ''}" data-i="${i}">
      <span class="sn">${i + 1}</span>
      <input class="w" inputmode="decimal" autocomplete="off" aria-label="Set ${i + 1} weight in kg" value="${esc(v.w)}" placeholder="kg">
      <input class="r" inputmode="numeric" autocomplete="off" aria-label="Set ${i + 1} reps" value="${esc(v.r)}" placeholder="reps">
      <button class="check" aria-label="${s ? 'Undo' : 'Complete'} set ${i + 1}"><span class="ring">${s ? ICON_CHECK : ''}</span></button>
    </div>`;
  }
  const canMinus = n > 0 && !bySlot[n - 1];
  const vid = ytId(ex.video);
  const hasInstr = ex.instructions || vid;
  const removeLabel = state.pending === 'remove'
    ? (today.length ? `Remove and delete ${plural(today.length, 'set')}?` : 'Tap again to remove')
    : 'Remove from this day';

  app.innerHTML = `
    <header class="nav">${backBtn(fmtShort(k))}</header>
    <div class="large-title">${esc(ex.name)}</div>
    <button class="lastbar" id="history">
      <span class="main"><span class="lb-label">${prevK ? `Last time · ${fmtShort(prevK)}` : 'Last time'}</span>
      <span class="lb-sets">${prevK ? prevSets.map(s => `<span style="white-space:nowrap">${fmtW(s.weight)} kg × ${s.reps}</span>`).join(', ') : 'No earlier sessions'}</span></span>
      <span class="lb-more">History <span class="chev">${ICON_CHEV}</span></span>
    </button>
    ${hasInstr ? `<details class="instr"><summary>Instructions</summary>
      ${ex.instructions ? `<div class="instr-text">${esc(ex.instructions)}</div>` : ''}
      ${vid ? `<a href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener">Watch video on YouTube ↗</a>` : ''}
    </details>` : ''}
    <div class="group">
      <div class="sets-head"><span>Set</span><span>kg</span><span>Reps</span><span></span></div>
      ${rows || '<div class="empty">No sets planned.</div>'}
    </div>
    <div class="stepper">
      <button id="minus" aria-label="Remove a set" ${canMinus ? '' : 'disabled'}>−</button>
      <span>${plural(n, 'set')}</span>
      <button id="plus" aria-label="Add a set">+</button>
    </div>
    <div class="group" style="margin-top:28px"><button class="cell destructive ${state.pending === 'remove' ? 'confirm' : ''}" id="remove">${removeLabel}</button></div>`;

  $('back').onclick = () => go('day');
  $('history').onclick = () => go('history', { stat: 'e1rm' });
  $('plus').onclick = () => { item.sets = n + 1; save(); state.pending = null; render(); };
  $('minus').onclick = () => { if (!canMinus) return; item.sets = n - 1; delete drafts[n - 1]; save(); state.pending = null; render(); };

  app.querySelectorAll('.setrow').forEach(row => {
    const i = Number(row.dataset.i);
    const wIn = row.querySelector('.w'), rIn = row.querySelector('.r');
    const done = bySlot[i];
    [wIn, rIn].forEach(inp => {
      inp.addEventListener('focus', () => inp.select());
      inp.addEventListener('input', () => {
        inp.classList.remove('bad');
        if (!done) drafts[i] = { w: wIn.value, r: rIn.value };
      });
      // Editing a finished set saves the change when you leave the field
      if (done) inp.addEventListener('change', () => {
        const w = parseW(wIn.value), r = parseR(rIn.value);
        if (isNaN(w) || isNaN(r)) { render(); return; }
        done.weight = w; done.reps = r; save();
      });
    });
    row.querySelector('.check').onclick = () => {
      if (done) {
        drafts[i] = { w: fmtW(done.weight), r: String(done.reps) };
        data.sets = data.sets.filter(s => s.id !== done.id);
        save(); render(); return;
      }
      const w = parseW(wIn.value), r = parseR(rIn.value);
      if (isNaN(w)) wIn.classList.add('bad');
      if (isNaN(r)) rIn.classList.add('bad');
      if (isNaN(w) || isNaN(r)) return;
      data.sets.push({ id: uid(), exId: ex.id, date: k, slot: i, weight: w, reps: r, ts: Date.now() });
      delete drafts[i];
      if (i + 1 > (item.sets || 0)) item.sets = i + 1;
      save(); state.pending = null; render();
    };
  });

  $('remove').onclick = () => {
    if (state.pending !== 'remove') { state.pending = 'remove'; return render(); }
    const day = data.days[k];
    day.items = day.items.filter(i => i.exId !== ex.id);
    if (!day.items.length) delete data.days[k];
    data.sets = data.sets.filter(s => !(s.exId === ex.id && s.date === k));
    delete state.drafts[dkey];
    save(); go('day');
  };
}

  const mode = state.pickerMode;
  app.innerHTML = `
    <header class="nav">${backBtn(fmtShort(state.selected))}</header>
    <div class="large-title">Add</div>
    <div class="seg"><button data-m="workouts" class="${mode === 'workouts' ? 'on' : ''}">Workouts</button><button data-m="exercises" class="${mode === 'exercises' ? 'on' : ''}">Exercises</button></div>
    ${mode === 'exercises' ? searchHTML('q', 'Search exercises') : ''}
    <div id="results"></div>`;

  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { state.pickerMode = b.dataset.m; render(); });
  const results = $('results');
  const inDay = dayOf(state.selected).items.map(i => i.exId);

  if (mode === 'workouts') {
    const list = data.workouts.slice().sort(byName);
    results.innerHTML = `<div class="group">${list.length
      ? list.map(w => cell({ attrs: `data-w="${w.id}"`, main: esc(w.name), sub: `${plural(w.items.length, 'exercise')} · ${plural(w.items.reduce((a, i) => a + i.sets, 0), 'set')}`, chev: false })).join('')
      : '<div class="empty">No workouts yet. Make one in the Workouts tab.</div>'}</div>`;

    state.pickerQuery = q.value;
    const term = q.value.trim().toLowerCase();
    const matches = data.exercises.filter(e => e.name.toLowerCase().includes(term)).sort(byName);
    results.innerHTML = `<div class="group"><button class="cell action" data-new="1">New exercise${q.value.trim() ? ` “${esc(q.value.trim())}”` : ''}</button></div>
      ${matches.length ? `<div class="group">${matches.map(e => inDay.includes(e.id)
        ? `<button class="cell" disabled><span class="main">${esc(e.name)}</span><span class="detail">Added</span></button>`
        : cell({ attrs: `data-id="${e.id}"`, main: esc(e.name), chev: false })).join('')}</div>` : ''}`;
    results.querySelectorAll('[data-id]').forEach(b => b.onclick = () => addExerciseToDay(b.dataset.id, null));
    results.querySelector('[data-new]').onclick = () => openSheet({ type: 'exForm', exId: null, name: q.value.trim(), onSave: id => addExerciseToDay(id, null) });
  };
  q.oninput = draw;
  draw();
}
function ensureDay(k) { return (data.days[k] = data.days[k] || { items: [], workouts: [] }); }
function addExerciseToDay(exId, sets) {
  const day = ensureDay(state.selected);
  if (!day.items.some(i => i.exId === exId)) day.items.push({ exId, sets: sets || 3 });
  save(); go('log', { logExId: exId });
}
function addWorkoutToDay(wId) {
  const w = woById(wId); if (!w) return;
  const day = ensureDay(state.selected);
  w.items.forEach(it => { if (!day.items.some(i => i.exId === it.exId)) day.items.push({ exId: it.exId, sets: it.sets }); });
  day.workouts.push({ id: w.id, name: w.name });
  save(); go('day');
}

/* ================= TODAY: calendar ================= */
function renderCalendar() {
  const m = state.calMonth;
  const logged = loggedDays();
  const tk = todayKey();
  const start = startOfWeek(m);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    if (i >= 35 && d.getMonth() !== m.getMonth()) break;
    const k = dk(d);
    const cls = [d.getMonth() !== m.getMonth() && 'out', k === tk && 'today', k === state.selected && 'sel'].filter(Boolean).join(' ');
    cells.push(`<button class="${cls}" data-k="${k}"><span class="num">${d.getDate()}</span><span class="dot ${logged.has(k) ? 'on' : ''}"></span></button>`);
  }
  app.innerHTML = `
    <header class="nav"><button class="tint" id="back">Done</button><span class="spacer"></span>
      <button class="icon-btn" id="prevM" aria-label="Previous month">${svg('<path d="M15 5l-7 7 7 7"/>', 20, 2.4)}</button>
      <button class="icon-btn" id="nextM" aria-label="Next month">${svg('<path d="M9 5l7 7-7 7"/>', 20, 2.4)}</button></header>
    <div class="large-title">${monthName(m)} <span style="color:var(--label2);font-weight:600">${m.getFullYear()}</span></div>
    <div class="cal-card">
      <div class="cal-head">${WD.map(w => `<div>${w}</div>`).join('')}</div>
      <div class="cal">${cells.join('')}</div>
    </div>`;
  $('back').onclick = () => go('day');
  $('prevM').onclick = () => { state.calMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1); render(); };
  $('nextM').onclick = () => { state.calMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1); render(); };
  app.querySelectorAll('.cal [data-k]').forEach(b => b.onclick = () => go('day', { selected: b.dataset.k, weekStart: startOfWeek(parse(b.dataset.k)) }));
}

/* ================= Progress + history (shared) ================= */
const STATS = [
  { key: 'e1rm', label: 'Est. 1RM', unit: 'kg' },
  { key: 'heaviest', label: 'Heaviest', unit: 'kg' },
  { key: 'volume', label: 'Volume', unit: 'kg' },
  { key: 'reps', label: 'Reps', unit: 'reps' },
];
function seriesFor(exId, key) {
  const byDate = {};
  data.sets.filter(s => s.exId === exId).forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });
  return Object.keys(byDate).sort().map(k => {
    const ss = byDate[k];
    let v, note;
    if (key === 'e1rm') { const best = ss.reduce((a, s) => (e1rm(s) > e1rm(a) ? s : a)); v = e1rm(best); note = `from ${fmtW(best.weight)} × ${best.reps}`; }
    else if (key === 'heaviest') { v = Math.max(...ss.map(s => s.weight)); note = plural(ss.length, 'set'); }
    else if (key === 'volume') { v = ss.reduce((a, s) => a + s.weight * s.reps, 0); note = plural(ss.length, 'set'); }
    else { v = ss.reduce((a, s) => a + s.reps, 0); note = plural(ss.length, 'set'); }
    return { k, t: parse(k).getTime(), v, note };
  });
}
const fmtStat = (v, key) => key === 'volume' || key === 'reps' ? Math.round(v).toLocaleString('en-GB') : (Math.round(v * 10) / 10).toFixed(1);

function progressHTML(exId) {
  const stat = STATS.find(s => s.key === state.stat);
  const pts = seriesFor(exId, stat.key);
  const last = pts[pts.length - 1];
  const best = pts.length ? Math.max(...pts.map(p => p.v)) : 0;
  const diff = pts.length > 1 ? last.v - pts[0].v : 0;
  return `
    <div class="seg">${STATS.map(s => `<button data-s="${s.key}" class="${s.key === stat.key ? 'on' : ''}">${s.label}</button>`).join('')}</div>
    <div class="card">
      ${pts.length ? `
        <div class="hsub">Latest · ${fmtShort(last.k)}</div>
        <div class="headline">${fmtStat(last.v, stat.key)}<small>${stat.unit}</small></div>
        ${pts.length > 1 ? `<div class="hsub">Best ${fmtStat(best, stat.key)} ${stat.unit} · ${diff >= 0 ? '+' : '−'}${fmtStat(Math.abs(diff), stat.key)} since ${fmtTiny(pts[0].k)}</div>` : ''}` : ''}
      <div class="chart" id="chart"></div>
    </div>
    ${stat.key === 'e1rm' && pts.length ? '<div class="footnote">Best set of each session, estimated with the Wathan formula. Most accurate for sets of about 10 reps or fewer.</div>' : ''}`;
}
function wireProgress(exId) {
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { state.stat = b.dataset.s; render(); });
  drawChart($('chart'), seriesFor(exId, state.stat), STATS.find(s => s.key === state.stat));
}
function historyHTML(exId) {
  const dates = [...new Set(data.sets.filter(s => s.exId === exId).map(s => s.date))].sort().reverse();
  return `<div class="section">History</div>` + (dates.length ? dates.map(k => {
    const ss = setsFor(exId, k);
    const best = Math.max(...ss.map(e1rm));
    return `<div class="hcard"><div class="hcard-head"><b>${fmtDayYear(k)}</b><span>e1RM ${fmtStat(best, 'e1rm')} kg</span></div>
      ${ss.map((s, i) => `<div class="hset"><span class="n">Set ${i + 1}</span>${fmtW(s.weight)} kg × ${s.reps}</div>`).join('')}</div>`;
  }).join('') : '<div class="group"><div class="empty">No sets logged yet.</div></div>');
}

function renderHistory() {
  const ex = exById(state.logExId);
  if (!ex) return go('day');
  app.innerHTML = `
    <header class="nav">${backBtn(ex.name)}</header>
    <div class="large-title">History</div>
    ${progressHTML(ex.id)}
    ${historyHTML(ex.id)}`;
  $('back').onclick = () => go('log');
  wireProgress(ex.id);
}

function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.floor(lo / step) * step; ; v += step) { out.push(+v.toFixed(6)); if (v >= hi - 1e-9) break; }
  return out;
}
function drawChart(box, pts, stat) {
  if (!pts.length) { box.style.height = 'auto'; box.style.margin = '0'; box.innerHTML = '<div style="color:var(--label2);padding:20px 0;text-align:center">Log some sets to see your progress here.</div>'; return; }
  const W = box.clientWidth, H = 210, L = 38, R = 8, T = 30, B = 22;
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { const p = Math.max(1, Math.abs(lo) * 0.05); lo -= p; hi += p; }
  const ticks = niceTicks(lo, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const x = t => t1 === t0 ? L + (W - L - R) / 2 : L + ((t - t0) / (t1 - t0)) * (W - L - R);
  const y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const tickFmt = v => stat.key === 'volume' && y1 >= 10000 ? `${Math.round(v / 1000)}k` : fmtW(v);
  const grid = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#ececef"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#8a8a8e">${tickFmt(v)}</text>`).join('');
  const xl = pts.length > 1
    ? `<text x="${L}" y="${H - 4}" font-size="11" fill="#8a8a8e">${fmtTiny(pts[0].k)}</text><text x="${W - R}" y="${H - 4}" text-anchor="end" font-size="11" fill="#8a8a8e">${fmtTiny(pts[pts.length - 1].k)}</text>`
    : `<text x="${x(t0)}" y="${H - 4}" text-anchor="middle" font-size="11" fill="#8a8a8e">${fmtTiny(pts[0].k)}</text>`;
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const dots = pts.map(p => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="4" fill="#007aff" stroke="#fff" stroke-width="2"/>`).join('');
  box.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${stat.label} over time">
      ${grid}${xl}
      <path d="${d}" fill="none" stroke="#007aff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      <line id="cross" y1="${T - 4}" y2="${H - B}" stroke="#c4c4c7" visibility="hidden"/>
      <circle id="focus" r="6" fill="#007aff" stroke="#fff" stroke-width="2" visibility="hidden"/>
      <rect id="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    </svg><div class="tip" id="tip" hidden></div>`;
  const hit = box.querySelector('#hit'), cross = box.querySelector('#cross'), focus = box.querySelector('#focus'), tip = box.querySelector('#tip');
  const show = e => {
    const mx = e.clientX - hit.getBoundingClientRect().left;
    let p = pts[0];
    for (const q of pts) if (Math.abs(x(q.t) - mx) < Math.abs(x(p.t) - mx)) p = q;
    const px = x(p.t), py = y(p.v);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    focus.setAttribute('cx', px); focus.setAttribute('cy', py); focus.setAttribute('visibility', 'visible');
    tip.hidden = false;
    tip.innerHTML = `<b>${fmtStat(p.v, stat.key)} ${stat.unit}</b> · ${fmtTiny(p.k)} · ${p.note}`;
    const half = tip.offsetWidth / 2;
    tip.style.left = Math.max(half, Math.min(W - half, px)) + 'px';
  };
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointermove', show);
}
window.addEventListener('resize', () => { if (!state.sheet && ['eDetail', 'history'].includes(state.views[state.tab])) render(); });

/* ================= EXERCISES tab ================= */
function renderExerciseList() {
  app.innerHTML = `
    <header class="nav"><span class="spacer"></span><button class="tint" id="newExTop" aria-label="Add a new exercise">${svg('<path d="M12 5v14M5 12h14"/>', 24, 2.2)}</button></header>
    <div class="large-title">Exercises</div>
    ${searchHTML('q', 'Search')}
    <div class="group"><button class="cell action" id="newEx">Add a new exercise</button></div>
    <div id="results" style="margin-top:12px"></div>`;
  const q = $('q');
  q.value = state.exQuery;
  const draw = () => {
    state.exQuery = q.value;
    const term = q.value.trim().toLowerCase();
    const list = data.exercises.filter(e => e.name.toLowerCase().includes(term)).sort(byName);
    $('results').innerHTML = `<div class="group">${list.length ? list.map(e => {
      const dates = data.sets.filter(s => s.exId === e.id).map(s => s.date).sort();
      return cell({ attrs: `data-id="${e.id}"`, main: esc(e.name), sub: dates.length ? `Last logged ${fmtShort(dates[dates.length - 1])}` : 'Never logged' });
    }).join('') : `<div class="empty">${data.exercises.length ? 'No matches.' : 'No exercises yet.'}</div>`}</div>`;
    $('results').querySelectorAll('[data-id]').forEach(b => b.onclick = () => go('eDetail', { detailExId: b.dataset.id, stat: 'e1rm' }));
  };
  q.oninput = draw;
  draw();
  const add = () => openSheet({ type: 'exForm', exId: null, name: q.value.trim(), onSave: id => go('eDetail', { detailExId: id, stat: 'e1rm' }) });
  $('newEx').onclick = add;
  $('newExTop').onclick = add;
}

function renderExerciseDetail() {
  const ex = exById(state.detailExId);
  if (!ex) return go('eList');
  const vid = ytId(ex.video);
  app.innerHTML = `
    <header class="nav">${backBtn('Exercises')}<span class="spacer"></span><button class="tint" id="edit">Edit</button></header>
    <div class="large-title">${esc(ex.name)}</div>
    ${progressHTML(ex.id)}
    <div class="section">Instructions</div>
    <div class="group">
      ${ex.instructions ? `<div class="instr-text" style="padding:12px 16px">${esc(ex.instructions)}</div>` : ''}
      ${vid ? `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${vid}" title="Exercise video" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>
               <a class="cell action" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener">Open in YouTube</a>` : ''}
      ${!ex.instructions && !vid ? '<div class="empty">No instructions yet. Tap Edit to add some.</div>' : ''}
    </div>
    ${historyHTML(ex.id)}`;
  $('back').onclick = () => go('eList');
  $('edit').onclick = () => openSheet({ type: 'exForm', exId: ex.id });
  wireProgress(ex.id);
}

/* ================= WORKOUTS tab ================= */
function renderWorkoutList() {
  const list = data.workouts.slice().sort(byName);
  app.innerHTML = `
    <header class="nav"><span class="spacer"></span><button class="tint" id="newWTop" aria-label="Create a new workout">${svg('<path d="M12 5v14M5 12h14"/>', 24, 2.2)}</button></header>
    <div class="large-title">Workouts</div>
    <div class="group"><button class="cell action" id="newW">Create a new workout</button></div>
    ${list.length ? `<div class="group" style="margin-top:12px">${list.map(w => cell({ attrs: `data-id="${w.id}"`, main: esc(w.name),
      sub: `${plural(w.items.length, 'exercise')} · ${plural(w.items.reduce((a, i) => a + i.sets, 0), 'set')}` })).join('')}</div>` : ''}`;
  const create = () => go('wEdit', { draft: { id: null, name: '', items: [] } });
  $('newW').onclick = create;
  $('newWTop').onclick = create;
  app.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
    const w = woById(b.dataset.id);
    go('wEdit', { draft: { id: w.id, name: w.name, items: w.items.map(i => ({ ...i })) } });
  });
}

function renderWorkoutEdit() {
  const dr = state.draft;
  if (!dr) return go('wList');
  const rows = dr.items.map((it, i) => {
    const ex = exById(it.exId);
    return `<div class="cell-wrap" style="display:flex;align-items:center">
      <button class="icon-btn" data-rm="${i}" aria-label="Remove" style="color:var(--red);margin-left:6px">${svg('<circle cx="12" cy="12" r="9" fill="currentColor" stroke="none"/><path d="M8 12h8" stroke="#fff" stroke-width="2.2"/>', 22)}</button>
      ${cell({ attrs: `data-sets="${i}" style="padding-left:4px"`, main: esc(ex ? ex.name : 'Deleted exercise'), detail: plural(it.sets, 'set') })}
    </div>`;
  }).join('');
  app.innerHTML = `
    <header class="nav"><button class="tint" id="cancel">Cancel</button><span class="spacer"></span><b>${dr.id ? 'Edit Workout' : 'New Workout'}</b><span class="spacer"></span><button class="tint" id="saveW" style="font-weight:600">Save</button></header>
    <div class="section">Name</div>
    <div class="group"><input class="field-input" id="wName" placeholder="e.g. Push day" autocomplete="off"></div>
    <div class="section">Exercises</div>
    <div class="group">${rows}<div class="cell-wrap"><button class="cell action" id="addToW">Add exercise</button></div></div>
    <div class="err" id="wErr"></div>
    ${dr.id ? `<div class="group" style="margin-top:28px"><button class="cell destructive ${state.pending === 'delW' ? 'confirm' : ''}" id="delW">${state.pending === 'delW' ? 'Tap again to delete' : 'Delete Workout'}</button></div>` : ''}`;
  const name = $('wName');
  name.value = dr.name;
  name.oninput = () => { dr.name = name.value; };
  $('cancel').onclick = () => go('wList', { draft: null });
  $('addToW').onclick = () => openSheet({ type: 'addToWorkout', step: 'pick', q: '' });
  app.querySelectorAll('[data-sets]').forEach(b => b.onclick = () => openSheet({ type: 'setCount', index: Number(b.dataset.sets) }));
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { dr.items.splice(Number(b.dataset.rm), 1); render(); });
  $('saveW').onclick = () => {
    const nm = dr.name.trim();
    if (!nm) { $('wErr').textContent = 'Give the workout a name.'; name.focus(); return; }
    if (dr.id) Object.assign(woById(dr.id), { name: nm, items: dr.items });
    else data.workouts.push({ id: uid(), name: nm, items: dr.items });
    save(); go('wList', { draft: null });
  };
  if ($('delW')) $('delW').onclick = () => {
    if (state.pending !== 'delW') { state.pending = 'delW'; return render(); }
    data.workouts = data.workouts.filter(w => w.id !== dr.id);
    save(); go('wList', { draft: null });
  };
}

/* ================= Bottom sheets ================= */
function openSheet(s) { state.sheet = s; state.pending = null; renderSheet(); }
function closeSheet() { state.sheet = null; state.pending = null; renderSheet(); }
function renderSheet() {
  const el = $('sheet');
  if (!state.sheet) { el.hidden = true; el.innerHTML = ''; document.body.classList.remove('locked'); return; }
  el.hidden = false; document.body.classList.add('locked');
  ({ exForm: sheetExForm, addToWorkout: sheetAddToWorkout, setCount: sheetSetCount })[state.sheet.type](el);
}
const sheetOpen = (label, head, body) => `<div class="backdrop"></div><div class="sheet" role="dialog" aria-label="${esc(label)}"><div class="grabber"></div><div class="sheet-head">${head}</div>${body}</div>`;

function sheetExForm(el) {
  const s = state.sheet;
  const ex = s.exId ? exById(s.exId) : null;
  if (s.instructions === undefined) {
    s.name = s.name || (ex ? ex.name : '');
    s.instructions = ex ? ex.instructions : '';
    s.video = ex ? ex.video : '';
  }
  const setCount = ex ? data.sets.filter(x => x.exId === ex.id).length : 0;
  const title = ex ? 'Edit Exercise' : 'New Exercise';
  el.innerHTML = sheetOpen(title,
    `<button class="tint" id="sCancel">Cancel</button><b>${title}</b><button class="tint strong" id="sSave">Save</button>`,
    `<div class="group"><input class="field-input" id="fName" placeholder="Name" autocomplete="off"></div>
     <div class="section">Tracked by</div>
     <div class="group"><div class="wheels">${wheelHTML('wA', TRACK_A)}<span class="x">×</span>${wheelHTML('wB', TRACK_B)}</div></div>
     <div class="section">Instructions <span style="text-transform:none">(optional)</span></div>
     <div class="group"><textarea class="field-input" id="fInstr" rows="4" placeholder="Setup, cues, things to remember…"></textarea></div>
     <div class="section">Video <span style="text-transform:none">(optional)</span></div>
     <div class="group"><input class="field-input" id="fVideo" inputmode="url" autocomplete="off" placeholder="YouTube link"></div>
     <div class="err" id="fErr"></div>
     ${ex ? `<div class="group" style="margin-top:28px"><button class="cell destructive ${state.pending === 'delEx' ? 'confirm' : ''}" id="sDel">${state.pending === 'delEx'
        ? `Tap again to delete${setCount ? ` (and ${plural(setCount, 'logged set')})` : ''}` : 'Delete Exercise'}</button></div>` : ''}`);
  const fName = $('fName'), fInstr = $('fInstr'), fVideo = $('fVideo');
  fName.value = s.name; fInstr.value = s.instructions; fVideo.value = s.video;
  fName.oninput = () => s.name = fName.value;
  fInstr.oninput = () => s.instructions = fInstr.value;
  fVideo.oninput = () => s.video = fVideo.value;
  initWheel('wA', ex ? Math.max(0, TRACK_A.findIndex(o => o.v === ex.track[0])) : 0);
  initWheel('wB', ex ? Math.max(0, TRACK_B.findIndex(o => o.v === ex.track[1])) : 0);
  if (!ex && !s.name) setTimeout(() => fName.focus(), 50);

  $('sCancel').onclick = () => closeSheet();
  $('sSave').onclick = () => {
    const name = s.name.trim();
    const err = $('fErr');
    if (!name) { err.textContent = 'Give the exercise a name.'; return; }
    if (data.exercises.some(e => e.name.toLowerCase() === name.toLowerCase() && e.id !== s.exId)) { err.textContent = 'An exercise with that name already exists.'; return; }
    const video = s.video.trim();
    if (video && !ytId(video)) { err.textContent = "That doesn't look like a YouTube link."; return; }
    const track = [TRACK_A[wheelIndex('wA')].v, TRACK_B[wheelIndex('wB')].v];
    let id = s.exId;
    if (ex) Object.assign(ex, { name, track, instructions: s.instructions.trim(), video });
    else { id = uid(); data.exercises.push({ id, name, track, instructions: s.instructions.trim(), video }); }
    save();
    const after = s.onSave;
    state.sheet = null;
    if (after) after(id); else render();
  };
  if ($('sDel')) $('sDel').onclick = () => {
    if (state.pending !== 'delEx') { state.pending = 'delEx'; return renderSheet(); }
    data.exercises = data.exercises.filter(e => e.id !== ex.id);
    data.sets = data.sets.filter(x => x.exId !== ex.id);
    data.workouts.forEach(w => { w.items = w.items.filter(i => i.exId !== ex.id); });
    for (const k in data.days) { data.days[k].items = data.days[k].items.filter(i => i.exId !== ex.id); if (!data.days[k].items.length) delete data.days[k]; }
    if (state.draft) state.draft.items = state.draft.items.filter(i => i.exId !== ex.id);
    save(); state.sheet = null; go('eList');
  };
}

const SET_OPTIONS = Array.from({ length: 10 }, (_, i) => ({ v: i + 1, label: `${i + 1}` }));
const setsStep = (title, backLabel, button) => sheetOpen(title,
  `<button class="tint" id="sBack">${backLabel}</button><b>${esc(title)}</b><span></span>`,
  `<div class="section" style="text-align:center;margin-left:0">Number of sets</div>
   <div class="group" style="max-width:200px;margin:0 auto"><div class="wheels">${wheelHTML('wSets', SET_OPTIONS)}</div></div>
   <button class="primary" id="sOk">${button}</button>`);

function sheetAddToWorkout(el) {
  const s = state.sheet;
  const dr = state.draft;
  if (s.step === 'sets') {
    const ex = exById(s.exId);
    el.innerHTML = setsStep(ex.name, 'Back', 'Add to Workout');
    initWheel('wSets', 2); // default 3 sets
    $('sBack').onclick = () => { s.step = 'pick'; renderSheet(); };
    $('sOk').onclick = () => { dr.items.push({ exId: ex.id, sets: SET_OPTIONS[wheelIndex('wSets')].v }); closeSheet(); render(); };
    return;
  }
  el.innerHTML = sheetOpen('Add Exercise',
    `<button class="tint" id="sCancel">Cancel</button><b>Add Exercise</b><span></span>`,
    `${searchHTML('sq', 'Search exercises')}<div id="sres"></div>`);
  const q = $('sq');
  q.value = s.q;
  const inW = dr.items.map(i => i.exId);
  const draw = () => {
    s.q = q.value;
    const term = q.value.trim().toLowerCase();
    const list = data.exercises.filter(e => e.name.toLowerCase().includes(term)).sort(byName);
    $('sres').innerHTML = `<div class="group"><button class="cell action" data-new="1">New exercise${q.value.trim() ? ` “${esc(q.value.trim())}”` : ''}</button></div>
      ${list.length ? `<div class="group">${list.map(e => inW.includes(e.id)
        ? `<button class="cell" disabled><span class="main">${esc(e.name)}</span><span class="detail">Added</span></button>`
        : cell({ attrs: `data-id="${e.id}"`, main: esc(e.name) })).join('')}</div>` : ''}`;
    $('sres').querySelectorAll('[data-id]').forEach(b => b.onclick = () => { s.exId = b.dataset.id; s.step = 'sets'; renderSheet(); });
    $('sres').querySelector('[data-new]').onclick = () => openSheet({
      type: 'exForm', exId: null, name: q.value.trim(),
      onSave: id => { state.sheet = { type: 'addToWorkout', step: 'sets', exId: id, q: '' }; render(); },
    });
  };
  q.oninput = draw;
  draw();
  $('sCancel').onclick = () => closeSheet();
}
function sheetSetCount(el) {
  const it = state.draft.items[state.sheet.index];
  const ex = exById(it.exId);
  el.innerHTML = setsStep(ex ? ex.name : 'Exercise', 'Cancel', 'Save');
  initWheel('wSets', it.sets - 1);
  $('sBack').onclick = () => closeSheet();
  $('sOk').onclick = () => { it.sets = SET_OPTIONS[wheelIndex('wSets')].v; closeSheet(); render(); };
}

render();

/* ================= Offline support ================= */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
